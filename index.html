    }
    h += `<section class="cartao"><div class="resumo">${anel(tot.kcal, m.kcal)}<div class="macros">
        ${barraMacro('Proteína', tot.p, m.p, 'var(--mp)')}${barraMacro('Carboidrato', tot.c, m.c, 'var(--mc)')}${barraMacro('Gordura', tot.g, m.g, 'var(--mg)')}
        ${!c.meta ? '<button type="button" class="botao fantasma peq" data-acao="aba" data-aba="ajustes" style="align-self:flex-start">Definir metas</button>' : ''}</div></div></section>`;

    // treino do dia
    const fichasDia = c.e.fichas.filter((f) => (f.dias || []).includes(N.diaSemana(S.dia)));
    const feitasHoje = c.sessoes.filter((s) => s.data === S.dia && s.status === 'concluida');
    h += `<section class="cartao"><div class="cartao-cab"><h2>Treino</h2>${feitasHoje.length ? `<span class="pill ok">${feitasHoje.length} registrado${feitasHoje.length > 1 ? 's' : ''}</span>` : ''}</div>
      ${fichasDia.length ? fichasDia.map((f) => `<div class="linha-lista"><div class="esq"><div class="miniatura icone">${ic('treinos')}</div><div><strong>${esc(f.nome)}</strong><small>${(f.exercicios || []).length} exercícios</small></div></div><div class="dir"><button type="button" class="botao primario peq" data-acao="comecar" data-id="${esc(f.id)}">Começar</button></div></div>`).join('')
        : `<p class="mudo" style="font-size:14px">Nenhuma ficha marcada para ${N.DIAS_LONGOS[N.diaSemana(S.dia)]}.</p>`}
      <div class="linha-botoes" style="margin-top:8px">${c.e.fichas.length && !fichasDia.length ? '<button type="button" class="botao peq" data-acao="aba" data-aba="treinos">Escolher ficha</button>' : ''}<button type="button" class="botao peq" data-acao="cardio">${ic('coracao')}Registrar cardio</button></div></section>`;

    // refeições do plano
    if (!plano.length) {
      h += `<section class="cartao"><div class="vazio"><strong>Nenhuma refeição planejada para ${N.DIAS_LONGOS[N.diaSemana(S.dia)]}</strong><span>Monte seu plano em Dieta: ele vira o checklist do dia. Você também pode só registrar o que comeu.</span><div class="linha-botoes" style="justify-content:center"><button type="button" class="botao primario peq" data-acao="aba" data-aba="dieta">Montar plano</button><button type="button" class="botao peq" data-acao="extra">Registrar alimento</button></div></div></section>`;
    }
    const idsPlano = new Set(plano.map((r) => r.id));
    for (const ref of plano) {
      const planejado = N.macrosRefeicao(ref, c.idx);
      const daRef = consumos.filter((x) => x.refeicao && x.refeicao.id === ref.id);
      const consRef = N.somar(daRef.map((x) => x.macros));
      const pendentes = (ref.itens || []).filter((it) => N.situacaoItem(it, consumos).estado === 'pendente');
      h += `<section class="cartao"><div class="refeicao-cab"><div><h3>${esc(ref.nome)}</h3><small>${esc(ref.horario || '')}${ref.horario ? ' · ' : ''}${N.fmt(consRef.kcal)} de ${N.fmt(planejado.kcal)} kcal</small></div>
        ${pendentes.length ? `<button type="button" class="botao peq" data-acao="comi-tudo" data-ref="${esc(ref.id)}">${ic('check')}Comi tudo</button>` : '<span class="pill ok">Feita</span>'}</div>
        ${(ref.itens || []).map((it) => linhaItemPlano(c, ref, it, consumos)).join('')}
        ${daRef.filter((x) => x.origem === 'extra').map((x) => linhaExtra(x)).join('')}
        <button type="button" class="botao fantasma peq" data-acao="extra" data-ref="${esc(ref.id)}">${ic('mais')}Adicionar nesta refeição</button></section>`;
    }
    const fora = consumos.filter((x) => !x.refeicao || !idsPlano.has(x.refeicao.id));
    h += `<section class="cartao"><div class="cartao-cab"><h2>Fora do plano</h2><small>${N.fmt(N.somar(fora.map((x) => x.macros)).kcal)} kcal</small></div>
      ${fora.length ? fora.map((x) => linhaExtra(x)).join('') : '<p class="mudo" style="font-size:14px">Lanches, bebidas e o que mais você comer além do plano. Registrar ajuda a entender o dia; não é uma falha.</p>'}
      <button type="button" class="botao peq" data-acao="extra" style="margin-top:8px">${ic('mais')}Registrar alimento</button></section>`;

    // água, hábitos, peso
    const agua = N.aguaTotal(c.dia);
    const metaAgua = m.aguaMl || 0;
    h += `<section class="grade-2"><div class="cartao"><div class="cartao-cab"><h2>Água</h2><small>${metaAgua ? `meta ${N.fmt(metaAgua)} ml` : ''}</small></div>
        <div class="agua"><span class="valor">${N.fmt(agua)} ml</span><div class="barra"><i style="width:${metaAgua ? Math.min(100, (agua / metaAgua) * 100) : 0}%;background:var(--mp)"></i></div></div>
        <div class="linha-botoes" style="margin-top:10px"><button type="button" class="botao" data-acao="agua" data-ml="250">${ic('gota')}+250 ml</button><button type="button" class="botao" data-acao="agua" data-ml="500">+500 ml</button><button type="button" class="botao" data-acao="agua-menos"${agua ? '' : ' disabled'} aria-label="Desfazer último copo">−</button></div></div>
      <div class="cartao"><div class="cartao-cab"><h2>Hábitos</h2><button type="button" class="botao fantasma peq" data-acao="aba" data-aba="ajustes">Editar</button></div>
        ${c.habitos.length ? `<div class="chips">${c.habitos.map((hb) => `<button type="button" class="chip-botao" data-acao="habito" data-id="${esc(hb.id)}" aria-pressed="${!!(c.dia && c.dia.habitos && c.dia.habitos[hb.id])}">${c.dia && c.dia.habitos && c.dia.habitos[hb.id] ? '✓ ' : ''}${esc(hb.nome)}</button>`).join('')}</div>` : '<p class="mudo" style="font-size:14px">Acompanhe suplementos, sono ou o que quiser. Crie em Ajustes.</p>'}</div></section>`;
    const pesoDia = c.e.medidas.find((x) => x.id === 'm_' + S.dia);
    h += `<section class="cartao"><div class="cartao-cab"><h2>Peso do dia</h2><button type="button" class="botao fantasma peq" data-acao="medidas">Medidas completas</button></div>
      <form class="linha-botoes" id="form-peso" style="align-items:center"><input class="entrada" id="peso-rapido" inputmode="decimal" placeholder="kg" value="${pesoDia && pesoDia.peso ? esc(N.fmtKg(pesoDia.peso)) : ''}" style="max-width:140px;font-family:var(--f-num);font-size:18px" aria-label="Peso em kg"><button type="submit" class="botao">${pesoDia && pesoDia.peso ? 'Atualizar' : 'Registrar'}</button></form></section>`;
    return h;
  }
  function linhaItemPlano(c, ref, it, consumos) {
    const a = c.idx.get(it.alimentoId);
    const sit = N.situacaoItem(it, consumos);
    const planejado = a ? N.macrosDe(a, it.gramas) : null;
    const qtd = it.qtd != null ? N.textoQtd(it.qtd, it.unidade) : N.textoQtd(it.gramas, 'g');
    let sub = `${esc(qtd)}${a && a.preparo ? ' · ' + esc(a.preparo) : ''}`;
    let kcal = planejado ? planejado.kcal : 0;
    if (sit.estado === 'parcial') { sub = `comeu ${N.fmt(sit.fracao * 100)}% · ${N.fmt(N.soma(sit.registros.map((x) => x.gramas)))} g de ${N.fmt(it.gramas)} g`; kcal = N.somar(sit.registros.map((x) => x.macros)).kcal; }
    if (sit.estado === 'trocado') { const r = sit.registros[0]; sub = `trocado por ${esc(r.nome)} (${esc(r.textoQtd)})`; kcal = N.somar(sit.registros.map((x) => x.macros)).kcal; }
    if (sit.estado === 'comido') kcal = N.somar(sit.registros.map((x) => x.macros)).kcal;
    const icone = sit.estado === 'parcial' ? 'meia' : sit.estado === 'trocado' ? 'troca' : 'check';
    const rotulo = sit.estado === 'pendente' ? `Marcar ${a ? a.nome : 'item'} como comido` : `Desmarcar ${a ? a.nome : 'item'}`;
    return `<div class="item"><button type="button" class="marcar ${sit.estado}" data-acao="marcar" data-ref="${esc(ref.id)}" data-item="${esc(it.id)}" aria-label="${esc(rotulo)}" aria-pressed="${sit.estado !== 'pendente'}">${ic(icone)}</button>
      <div class="nome"><strong>${esc(a ? a.nome : (it.nome || 'Alimento excluído'))}</strong><small>${sub}</small></div>
      <span class="kcal">${N.fmt(kcal)} kcal</span>
      <button type="button" class="mais-op" data-acao="ajustar" data-ref="${esc(ref.id)}" data-item="${esc(it.id)}" aria-label="Ajustar quantidade ou trocar">${ic('pontos')}</button></div>`;
  }
  const linhaExtra = (x) => `<div class="item extra"><button type="button" class="marcar comido" data-acao="remover-consumo" data-id="${esc(x.id)}" aria-label="Remover ${esc(x.nome)}">${ic('check')}</button>
      <div class="nome"><strong>${esc(x.nome)}</strong><small>${esc(x.textoQtd)}${x.preparo ? ' · ' + esc(x.preparo) : ''}${x.hora ? ' · ' + esc(x.hora) : ''}</small></div>
      <span class="kcal">${N.fmt(x.macros && x.macros.kcal)} kcal</span>
      <button type="button" class="mais-op" data-acao="editar-consumo" data-id="${esc(x.id)}" aria-label="Editar quantidade">${ic('pontos')}</button></div>`;

  // ---------- ações do diário ----------
  const pares = (lista) => lista;
  function limiteDia(c, novos) {
    const n = Object.keys((c.dia && c.dia.consumo) || {}).length + novos;
    if (n > N.LIMITES.consumoPorDia) { toast(`Este dia já tem ${N.LIMITES.consumoPorDia} registros, o limite.`, { tipo: 'erro' }); return false; }
    return true;
  }
  function acharItem(c, refId, itemId) {
    const ref = c.e.plano.find((r) => r.id === refId);
    const it = ref && (ref.itens || []).find((i) => i.id === itemId);
    return { ref, it };
  }
  function registroDoItem(c, ref, it, gramas, extra) {
    const a = c.idx.get(it.alimentoId);
    if (!a) return null;
    const g = gramas != null ? gramas : it.gramas;
    return N.registroConsumo({ id: D.novoId('c'), alimento: a, gramas: g, textoQtd: gramas != null ? N.textoQtd(g, 'g') : (it.qtd != null ? N.textoQtd(it.qtd, it.unidade) : N.textoQtd(g, 'g')), origem: 'plano', refeicao: { id: ref.id, nome: ref.nome }, planoItemId: it.id, hora: S.dia === N.hoje() ? horaAgora() : '', ...extra });
  }
  async function marcarItem(refId, itemId) {
    const c = C();
    const { ref, it } = acharItem(c, refId, itemId);
    if (!it) return;
    const sit = N.situacaoItem(it, N.consumosDoDia(c.dia));
    if (sit.estado !== 'pendente') {
      const antes = sit.registros;
      const r = await campos('diario', S.dia, pares(antes.map((x) => [['consumo', x.id], D.APAGAR])));
      if (r) toast('Desmarcado', { desfazer: () => campos('diario', S.dia, antes.map((x) => { const { id, ...resto } = x; return [['consumo', id], { ...resto, id }]; })) });
      return;
    }
    const reg = registroDoItem(c, ref, it);
    if (!reg) { toast('Este alimento foi excluído da sua lista. Edite a refeição em Dieta.', { tipo: 'erro' }); return; }
    if (!limiteDia(c, 1)) return;
    await campos('diario', S.dia, [[['consumo', reg.id], reg]]);
  }
  async function comiTudo(refId) {
    const c = C();
    const ref = c.e.plano.find((r) => r.id === refId);
    if (!ref) return;
    const cons = N.consumosDoDia(c.dia);
    const regs = (ref.itens || []).filter((it) => N.situacaoItem(it, cons).estado === 'pendente').map((it) => registroDoItem(c, ref, it)).filter(Boolean);
    if (!regs.length || !limiteDia(c, regs.length)) return;
    const r = await campos('diario', S.dia, regs.map((x) => [['consumo', x.id], x]));
    if (r) toast(`${ref.nome}: ${regs.length} ${regs.length > 1 ? 'itens marcados' : 'item marcado'}`, { desfazer: () => campos('diario', S.dia, regs.map((x) => [['consumo', x.id], D.APAGAR])) });
  }
  function ajustarItem(refId, itemId) {
    const c = C();
    const { ref, it } = acharItem(c, refId, itemId);
    const a = it && c.idx.get(it.alimentoId);
    if (!it) return;
    if (!a) { toast('Este alimento foi excluído da sua lista. Edite a refeição em Dieta.', { tipo: 'erro' }); return; }
    const sit = N.situacaoItem(it, N.consumosDoDia(c.dia));
    const gramasAtuais = sit.registros.length && sit.estado !== 'trocado' ? N.soma(sit.registros.map((x) => x.gramas)) : it.gramas;
    abrirModal({
      titulo: esc(a.nome),
      corpo: `<p class="mudo">Planejado: ${esc(it.qtd != null ? N.textoQtd(it.qtd, it.unidade) : N.textoQtd(it.gramas, 'g'))} (${N.fmt(it.gramas)} g) em ${esc(ref.nome)}.</p>
        ${campoQuantidade(a, gramasAtuais, 'g', 'aj')}
        <div class="aviso neutro" id="aj-previa"></div>
        <div class="linha-botoes"><button type="button" class="botao" data-x="trocar">${ic('troca')}Troquei por outro alimento</button>${sit.estado !== 'pendente' ? '<button type="button" class="botao perigo" data-x="nao">Não comi</button>' : ''}</div>
        <div class="erro-campo"></div>`,
      rodape: rodapeForm('', 'Salvar quantidade'),
      aoMontar: (v) => {
        ligarQuantidade(v, a, 'aj');
        v.querySelector('[data-x=trocar]').onclick = async () => {
          const esc2 = await escolherAlimento({ titulo: `Trocar ${a.nome} por…` });
          if (!esc2) return;
          if (!limiteDia(c, 1)) return;
          const reg = N.registroConsumo({ id: D.novoId('c'), alimento: esc2.alimento, gramas: esc2.gramas, textoQtd: esc2.texto, origem: 'substituto', refeicao: { id: ref.id, nome: ref.nome }, planoItemId: it.id, substituiu: { alimentoId: a.id, nome: a.nome }, hora: S.dia === N.hoje() ? horaAgora() : '' });
          const r = await campos('diario', S.dia, [...sit.registros.map((x) => [['consumo', x.id], D.APAGAR]), [['consumo', reg.id], reg]]);
          if (r) { fecharModal(v); salvo(r, `Trocado por ${esc2.alimento.nome}`); }
        };
        const bn = v.querySelector('[data-x=nao]');
        if (bn) bn.onclick = async () => { const r = await campos('diario', S.dia, sit.registros.map((x) => [['consumo', x.id], D.APAGAR])); if (r) { fecharModal(v); toast('Marcado como não comido'); } };
        ligarEnvio(v, async () => {
          const q = lerQuantidade(v, a, 'aj');
          if (typeof q === 'string') return q;
          const reg = registroDoItem(c, ref, it, q.gramas, { textoQtd: q.texto });
          if (!sit.registros.length && !limiteDia(c, 1)) return false;
          const r = await campos('diario', S.dia, [...sit.registros.map((x) => [['consumo', x.id], D.APAGAR]), [['consumo', reg.id], reg]]);
          if (r) salvo(r, q.gramas < it.gramas * 0.95 ? 'Registrado como consumo parcial' : 'Quantidade registrada');
          return !!r;
        });
      },
    });
  }
  async function registrarExtra(refId) {
    const c = C();
    const plano = N.planoDoDia(c.e.plano, S.dia);
    const r0 = refId ? plano.find((r) => r.id === refId) : null;
    const res = await escolherAlimento({ titulo: r0 ? `Adicionar em ${r0.nome}` : 'Registrar alimento', refeicoes: plano, refeicaoInicial: refId || '' });
    if (!res) return;
    if (!limiteDia(C(), 1)) return;
    const ref = plano.find((r) => r.id === res.refeicao);
    const reg = N.registroConsumo({ id: D.novoId('c'), alimento: res.alimento, gramas: res.gramas, textoQtd: res.texto, origem: 'extra', refeicao: ref ? { id: ref.id, nome: ref.nome } : null, hora: S.dia === N.hoje() ? horaAgora() : '' });
    salvo(await campos('diario', S.dia, [[['consumo', reg.id], reg]]), `${res.alimento.nome} registrado`);
  }
  function editarConsumo(id) {
    const c = C();
    const x = N.consumosDoDia(c.dia).find((e) => e.id === id);
    if (!x) return;
    const a = c.idx.get(x.alimentoId) || { id: x.alimentoId, nome: x.nome, preparo: x.preparo, unidades: [], por100: x.gramas ? { kcal: x.macros.kcal * 100 / x.gramas, p: x.macros.p * 100 / x.gramas, c: x.macros.c * 100 / x.gramas, g: x.macros.g * 100 / x.gramas } : { kcal: 0, p: 0, c: 0, g: 0 } };
    abrirModal({
      titulo: esc(x.nome),
      corpo: `${campoQuantidade(a, x.gramas, 'g', 'ec')}<div class="aviso neutro" id="ec-previa"></div><p class="mudo" style="font-size:13px">Os valores usados são os do registro original (${esc(x.fonte || 'sua lista')}).</p><div class="erro-campo"></div>`,
      rodape: rodapeForm('<button type="button" class="botao perigo" data-x="rem">Remover</button>'),
      aoMontar: (v) => {
        ligarQuantidade(v, a, 'ec');
        v.querySelector('[data-x=rem]').onclick = async () => { const r = await campos('diario', S.dia, [[['consumo', id], D.APAGAR]]); if (r) { fecharModal(v); toast('Removido', { desfazer: () => campos('diario', S.dia, [[['consumo', id], x]]) }); } };
        ligarEnvio(v, async () => {
          const q = lerQuantidade(v, a, 'ec');
          if (typeof q === 'string') return q;
          const novo = { ...x, gramas: N.r1(q.gramas), textoQtd: q.texto, macros: N.macrosDe(a, q.gramas) };
          delete novo.id;
          const r = await campos('diario', S.dia, [[['consumo', id], { ...novo, id }]]);
          salvo(r, 'Atualizado');
          return !!r;
        });
      },
    });
  }
  async function removerConsumo(id) {
    const x = N.consumosDoDia(C().dia).find((e) => e.id === id);
    if (!x) return;
    const r = await campos('diario', S.dia, [[['consumo', id], D.APAGAR]]);
    if (r) toast(`${x.nome} removido`, { desfazer: () => campos('diario', S.dia, [[['consumo', id], x]]) });
  }

  // ---------- quantidade (g, unidades) ----------
  function campoQuantidade(a, gramas, unidade, pfx) {
    const uns = (a.unidades || []);
    return `<div class="campos"><label class="campo"><span>Quantidade</span><input id="${pfx}-qtd" inputmode="decimal" value="${esc(N.fmt(gramas, Number(gramas) % 1 ? 1 : 0))}" autofocus></label>
      <label class="campo"><span>Medida</span><select id="${pfx}-un">${opt('g', 'gramas (g)', unidade === 'g')}${uns.map((u) => opt(u.nome, `${u.nome} (${N.fmt(u.gramas)} g)`, unidade === u.nome)).join('')}</select></label></div>`;
  }
  function lerQuantidade(v, a, pfx) {
    const q = N.num(val(v, `#${pfx}-qtd`));
    if (!(q > 0) || q > 5000) return 'Informe uma quantidade maior que zero.';
    const un = val(v, `#${pfx}-un`) || 'g';
    const gramas = N.gramasDe(a, q, un);
    if (gramas > 5000) return 'Quantidade grande demais para um registro.';
    return { qtd: q, unidade: un, gramas, texto: N.textoQtd(q, un) };
  }
  function ligarQuantidade(v, a, pfx) {
    const atual = () => {
      const q = lerQuantidade(v, a, pfx);
      const p = $(`#${pfx}-previa`, v);
      if (!p) return;
      if (typeof q === 'string') { p.textContent = q; return; }
      const m = N.macrosDe(a, q.gramas);
      p.textContent = `${N.fmt(q.gramas)} g · ${N.fmt(m.kcal)} kcal · P ${N.fmt(m.p, 1)} g · C ${N.fmt(m.c, 1)} g · G ${N.fmt(m.g, 1)} g`;
    };
    v.addEventListener('input', atual); v.addEventListener('change', atual); atual();
  }

  /** Escolher alimento (base + meus) e a quantidade. Resolve {alimento, gramas, texto, refeicao} ou null. */
  function escolherAlimento({ titulo, refeicoes, refeicaoInicial }) {
    return new Promise((ok) => {
      let escolhido = null, resultado = null;
      abrirModal({
        titulo: esc(titulo), largo: true,
        corpo: `<div id="ea-lista"><input class="entrada" id="ea-busca" placeholder="Buscar alimento (ex.: arroz, frango, ovo)" autocomplete="off" autofocus>
          <div id="ea-res" style="margin-top:8px"></div>
          <button type="button" class="botao fantasma peq" data-x="novo" style="margin-top:6px">${ic('mais')}Criar alimento novo</button></div>
          <div id="ea-passo2" hidden></div>`,
        aoFechar: () => ok(resultado),
        aoMontar: (v) => {
          const listar = () => {
            const c = C();
            const q = val(v, '#ea-busca').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
            const todos = [...c.idx.values()].filter((a) => !q || `${a.nome} ${a.preparo} ${a.grupo || ''}`.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().includes(q))
              .sort((x, y) => Number(x.daBase) - Number(y.daBase) || x.nome.localeCompare(y.nome, 'pt-BR')).slice(0, 60);
            $('#ea-res', v).innerHTML = todos.length ? todos.map((a) => `<div class="linha-lista clicavel" data-ali="${esc(a.id)}" role="button" tabindex="0" style="padding-inline:6px"><div class="esq"><div><strong>${esc(a.nome)}</strong><small>${esc(a.preparo)} · ${N.fmt(a.por100.kcal)} kcal/100 g · ${esc(a.daBase ? 'TACO/rótulo' : (a.editadoDaBase ? 'editado por você' : 'meu alimento'))}</small></div></div><div class="dir">${ic('dir')}</div></div>`).join('')
              : '<div class="vazio"><strong>Nada encontrado</strong><span>Crie o alimento com os valores do rótulo.</span></div>';
          };
          v.addEventListener('input', (ev) => { if (ev.target.id === 'ea-busca') listar(); });
          listar();
          const mostrarQtd = (a) => {
            escolhido = a;
            $('#ea-lista', v).hidden = true;
            const q = $('#ea-passo2', v);
            q.hidden = false;
            const un0 = (a.unidades && a.unidades[0]) ? a.unidades[0].nome : 'g';
            q.innerHTML = `<div style="display:flex;flex-direction:column;gap:12px"><div><strong style="font-size:16px">${esc(a.nome)}</strong><div class="mudo" style="font-size:13px">${esc(a.preparo)} · ${esc(a.fonte || '')}</div></div>
              ${campoQuantidade(a, un0 === 'g' ? 100 : 1, un0, 'ea')}
              ${refeicoes && refeicoes.length ? `<label class="campo"><span>Refeição</span><select id="ea-ref">${opt('', 'Fora do plano', !refeicaoInicial)}${refeicoes.map((r) => opt(r.id, r.nome, r.id === refeicaoInicial)).join('')}</select></label>` : ''}
              <div class="aviso neutro" id="ea-previa"></div><div class="erro-campo"></div>
              <div class="linha-botoes"><button type="button" class="botao" data-x="voltar">${ic('esq')}Outro alimento</button><button type="button" class="botao primario" data-x="ok" style="margin-left:auto">Adicionar</button></div></div>`;
            ligarQuantidade(v, a, 'ea');
            setTimeout(() => { const i = $('#ea-passo2 input', v); if (i && !matchMedia('(max-width: 620px)').matches) i.select(); }, 30);
          };
          v.addEventListener('click', async (ev) => {
            const li = ev.target.closest('[data-ali]');
            if (li) { mostrarQtd(C().idx.get(li.dataset.ali)); return; }
            const x = ev.target.closest('[data-x]');
            if (!x) return;
            if (x.dataset.x === 'voltar') { $('#ea-lista', v).hidden = false; $('#ea-passo2', v).hidden = true; return; }
            if (x.dataset.x === 'novo') { const novo = await editarAlimento(null, val(v, '#ea-busca')); if (novo) mostrarQtd(novo); return; }
            if (x.dataset.x === 'ok') {
              const q = lerQuantidade(v, escolhido, 'ea');
              if (typeof q === 'string') { $('#ea-passo2 .erro-campo', v).textContent = q; return; }
              resultado = { alimento: escolhido, gramas: q.gramas, texto: q.texto, qtd: q.qtd, unidade: q.unidade, refeicao: val(v, '#ea-ref') };
              fecharModal(v);
            }
          });
          v.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && ev.target.closest('[data-ali]')) { ev.preventDefault(); ev.target.click(); } });
        },
      });
    });
  }

  // ====================================================================
  // DIETA
  // ====================================================================
  function vDieta() {
    const c = C();
    const ds = S.diaPlano;
    const refs = c.e.plano.filter((r) => (r.dias || []).includes(ds)).sort((a, b) => (a.horario || '99').localeCompare(b.horario || '99'));
    const total = N.somar(refs.map((r) => N.macrosRefeicao(r, c.idx)));
    const m = c.metaHoje || {};

  function editarRefeicao(r, copia) {
    const c = C();
    const novo = !r || copia;
    const base = r ? structuredClone(r) : { nome: '', horario: '', dias: [S.diaPlano], itens: [] };
    let itens = (base.itens || []).map((x) => ({ ...x, id: copia ? D.novoId('it') : x.id }));
    abrirModal({
      titulo: copia ? 'Duplicar refeição' : r ? 'Editar refeição' : 'Nova refeição', largo: true,
      corpo: `<form novalidate style="display:flex;flex-direction:column;gap:14px"><div class="campos"><label class="campo"><span>Nome</span><input id="rf-nome" maxlength="40" list="rf-sug" value="${esc(base.nome)}" placeholder="Ex.: Almoço" autofocus><datalist id="rf-sug">${SUGESTOES_REFEICAO.map((s) => `<option value="${esc(s)}">`).join('')}</datalist></label>
        <label class="campo"><span>Horário</span><input id="rf-hora" type="time" value="${esc(base.horario || '')}"></label></div>
        <fieldset class="campo"><legend>Dias da semana</legend>${diasChips('rf-dias', base.dias || [])}</fieldset>
        <div><div class="rotulo-mini" style="margin-bottom:4px">Itens</div><div id="rf-itens"></div><button type="button" class="botao peq" data-x="add" style="margin-top:8px">${ic('mais')}Adicionar alimento</button></div>
        <div class="aviso neutro" id="rf-total"></div><div class="erro-campo"></div></form>`,
      rodape: rodapeForm(r && !copia ? '<button type="button" class="botao perigo" data-x="excluir">Excluir</button>' : ''),
      aoMontar: (v) => {
        const desenhar = () => {
          const cc = C();
          $('#rf-itens', v).innerHTML = itens.length ? itens.map((it, i) => { const a = cc.idx.get(it.alimentoId); const m = a ? N.macrosDe(a, it.gramas) : null; return `<div class="linha-lista"><div class="esq"><div><strong>${esc(a ? a.nome : it.nome || 'Alimento excluído')}</strong><small>${esc(it.qtd != null ? N.textoQtd(it.qtd, it.unidade) : N.textoQtd(it.gramas, 'g'))} · ${m ? N.fmt(m.kcal) + ' kcal' : '—'}</small></div></div><div class="dir"><button type="button" class="mais-op" data-sobe="${i}" aria-label="Subir"${i ? '' : ' disabled'}>${ic('sobe')}</button><button type="button" class="mais-op" data-rem="${i}" aria-label="Remover">${ic('x')}</button></div></div>`; }).join('') : '<p class="mudo" style="font-size:14px">Adicione os alimentos desta refeição.</p>';
          const t = N.somar(itens.map((it) => { const a = cc.idx.get(it.alimentoId); return a ? N.macrosDe(a, it.gramas) : null; }));
          $('#rf-total', v).textContent = `Total: ${N.fmt(t.kcal)} kcal · P ${N.fmt(t.p, 1)} g · C ${N.fmt(t.c, 1)} g · G ${N.fmt(t.g, 1)} g`;
        };
        desenhar();
        v.addEventListener('click', async (ev) => {
          const rem = ev.target.closest('[data-rem]'); if (rem) { itens.splice(Number(rem.dataset.rem), 1); desenhar(); return; }
          const sobe = ev.target.closest('[data-sobe]'); if (sobe) { const i = Number(sobe.dataset.sobe); [itens[i - 1], itens[i]] = [itens[i], itens[i - 1]]; desenhar(); return; }
          const x = ev.target.closest('[data-x]'); if (!x) return;
          if (x.dataset.x === 'add') {
            if (itens.length >= N.LIMITES.itensPorRefeicao) { toast('Limite de itens por refeição atingido.', { tipo: 'erro' }); return; }
            const res = await escolherAlimento({ titulo: 'Adicionar à refeição' });
            if (res) { itens.push({ id: D.novoId('it'), alimentoId: res.alimento.id, nome: res.alimento.nome, gramas: N.r1(res.gramas), qtd: res.qtd, unidade: res.unidade }); desenhar(); }
          }
          if (x.dataset.x === 'excluir' && await confirmar({ titulo: 'Excluir refeição?', texto: `“${esc(base.nome)}” sai do plano. Os dias já registrados continuam como estão.`, botao: 'Excluir', perigo: true })) {
            if (await apagarDoc('plano', r.id)) { fecharModal(v); toast('Refeição excluída'); }
          }
        });
        ligarEnvio(v, async () => {
          const nome = N.validar.texto(val(v, '#rf-nome'), 40, 'Nome');
          if (!nome) return 'Dê um nome para a refeição.';
          const dias = lerDias(v, 'rf-dias');
          if (!dias.length) return 'Marque pelo menos um dia da semana.';
          const d = { id: novo ? D.novoId('rf') : r.id, nome, horario: val(v, '#rf-hora') || '', dias, itens, criadoEm: base.criadoEm || agoraIso() };
          const res = await doc('plano', d);
          salvo(res, novo ? 'Refeição criada' : 'Refeição atualizada');
          return !!res;
        });
      },
    });
  }
  /** Criar/editar alimento. Editar um da base cria a cópia do usuário com o mesmo id. Resolve o alimento salvo ou null. */
  function editarAlimento(a, nomeInicial) {
    return new Promise((ok) => {
      let salvoAli = null;
      const daBase = a && a.daBase;
      const editadoDaBase = a && (a.editadoDaBase || daBase);
      const x = a || { nome: nomeInicial || '', preparo: 'cru', fonte: 'Rótulo', por100: { kcal: '', p: '', c: '', g: '' }, unidades: [] };
      const uns = (x.unidades || []).concat([{ nome: '', gramas: '' }, { nome: '', gramas: '' }]).slice(0, Math.max(2, (x.unidades || []).length + 1));
      abrirModal({
        titulo: !a ? 'Novo alimento' : daBase ? 'Editar alimento da base' : 'Editar alimento', largo: true,
        corpo: `<form novalidate style="display:flex;flex-direction:column;gap:14px">
          ${daBase ? '<div class="aviso neutro">Você vai criar a sua versão deste alimento. A base e os dias já registrados não mudam.</div>' : ''}
          <div class="campos"><label class="campo"><span>Nome</span><input id="al-nome" maxlength="60" value="${esc(x.nome)}" autofocus placeholder="Ex.: Pão de queijo"></label>
          <label class="campo"><span>Preparo</span><select id="al-prep">${PREPAROS.concat(PREPAROS.includes(x.preparo) ? [] : [x.preparo]).map((p) => opt(p, p, p === x.preparo)).join('')}</select></label>
          <label class="campo largo"><span>Fonte dos valores</span><select id="al-fonte">${['Rótulo', 'Minha medida', 'Nutricionista', x.fonte].filter((v2, i, arr) => v2 && arr.indexOf(v2) === i).map((f) => opt(f, f, f === x.fonte)).join('')}</select></label></div>
          <div><div class="rotulo-mini" style="margin-bottom:6px">Valores por 100 g (ou 100 ml)</div><div class="campos quatro">
            <label class="campo"><span>Calorias (kcal)</span><input id="al-kcal" inputmode="decimal" value="${esc(x.por100.kcal)}"></label>
            <label class="campo"><span>Proteína (g)</span><input id="al-p" inputmode="decimal" value="${esc(x.por100.p)}"></label>
            <label class="campo"><span>Carboidrato (g)</span><input id="al-c" inputmode="decimal" value="${esc(x.por100.c)}"></label>
            <label class="campo"><span>Gordura (g)</span><input id="al-g" inputmode="decimal" value="${esc(x.por100.g)}"></label></div></div>
          <div><div class="rotulo-mini" style="margin-bottom:6px">Medidas caseiras (opcional)</div>${uns.map((u, i) => `<div class="campos" style="margin-bottom:8px"><label class="campo"><span>Medida</span><input id="al-un-${i}" maxlength="30" value="${esc(u.nome)}" placeholder="Ex.: unidade, fatia"></label><label class="campo"><span>Gramas</span><input id="al-ug-${i}" inputmode="decimal" value="${esc(u.gramas)}"></label></div>`).join('')}</div>
          <div class="erro-campo"></div></form>`,
        rodape: rodapeForm(a && !daBase ? `<button type="button" class="botao perigo" data-x="excluir">${editadoDaBase ? 'Voltar aos valores da base' : 'Excluir'}</button>` : ''),
        aoFechar: () => ok(salvoAli),
        aoMontar: (v) => {
          const bx = v.querySelector('[data-x=excluir]');
          if (bx) bx.onclick = async () => {
            const noPlano = C().e.plano.some((r) => (r.itens || []).some((i) => i.alimentoId === a.id));
            if (!editadoDaBase && noPlano) { toast('Este alimento está no seu plano. Tire das refeições antes de excluir.', { tipo: 'erro', ms: 6000 }); return; }
            if (await confirmar({ titulo: editadoDaBase ? 'Voltar aos valores da base?' : 'Excluir alimento?', texto: 'Os dias já registrados não mudam.', botao: editadoDaBase ? 'Voltar' : 'Excluir', perigo: !editadoDaBase })) {
              if (await apagarDoc('alimentos', a.id)) { fecharModal(v); toast(editadoDaBase ? 'Valores da base restaurados' : 'Alimento excluído'); }
            }
          };
          ligarEnvio(v, async () => {
            const nome = N.validar.texto(val(v, '#al-nome'), 60, 'Nome');
            if (!nome) return 'Dê um nome ao alimento.';
            const num = (id, rot, max) => N.validar.numero(val(v, id), 0, max, rot);
            const por100 = { kcal: num('#al-kcal', 'Calorias', 950), p: num('#al-p', 'Proteína', 100), c: num('#al-c', 'Carboidrato', 100), g: num('#al-g', 'Gordura', 100) };
            const unidades = [];
            uns.forEach((_, i) => { const n = val(v, `#al-un-${i}`); const g = N.num(val(v, `#al-ug-${i}`)); if (n && g > 0 && g <= 5000) unidades.push({ nome: N.validar.texto(n, 30, 'Medida'), gramas: N.r1(g) }); });
            const d = { id: a ? a.id : D.novoId('al'), nome, preparo: val(v, '#al-prep'), fonte: val(v, '#al-fonte'), grupo: (a && a.grupo) || 'Meus alimentos', por100, unidades, editadoDaBase: !!editadoDaBase, criadoEm: (a && a.criadoEm) || agoraIso() };
            const r = await doc('alimentos', d);
            if (r) { salvoAli = { ...d, daBase: false }; salvo(r, a ? 'Alimento atualizado' : 'Alimento criado'); }
            return !!r;
          });
        },
      });
    });
  }

            if (exs.length >= N.LIMITES.exerciciosPorFicha) { toast('Limite de exercícios por ficha atingido.', { tipo: 'erro' }); return; }
            lerCampos();
            const id = await biblioteca({ escolher: true });
            if (id) { const ex = C().bib.get(id); exs.push({ chave: D.novoId('ex'), exercicioId: id, series: ex.grupo === 'Cardio' ? 1 : 3, reps: ex.grupo === 'Cardio' ? '20 min' : '10-12', carga: null, descanso: 90 }); desenhar(); }
          }
          if (x.dataset.x === 'excluir' && await confirmar({ titulo: 'Excluir ficha?', texto: `“${esc(base.nome)}” será excluída. Os treinos já feitos continuam no histórico.`, botao: 'Excluir', perigo: true })) {
            if (await apagarDoc('fichas', f.id)) { fecharModal(v); toast('Ficha excluída'); }
          }
        });
        ligarEnvio(v, async () => {
          lerCampos();
          const nome = N.validar.texto(val(v, '#fi-nome'), 50, 'Nome');
          if (!nome) return 'Dê um nome à ficha.';
          for (const e of exs) { N.validar.numero(e.series, 1, N.LIMITES.seriesPorExercicio, 'Séries'); if (e.carga != null) N.validar.numero(e.carga, 0, 1000, 'Carga'); e.reps = N.validar.texto(e.reps, 12, 'Repetições'); }
          const d = { id: f ? f.id : D.novoId('fi'), nome, dias: lerDias(v, 'fi-dias'), exercicios: exs.map((e) => ({ chave: e.chave, exercicioId: e.exercicioId, series: Math.round(e.series), reps: e.reps, carga: e.carga, descanso: Number(e.descanso) || 90, obs: e.obs || '' })), criadoEm: base.criadoEm || agoraIso() };
          const r = await doc('fichas', d);
          salvo(r, f ? 'Ficha atualizada' : 'Ficha criada');
          return !!r;
        });
      },
    });
  }
  /** Biblioteca: consulta ou escolha. Resolve o id escolhido (modo escolher) ou null. */

            let lista = [...c.bib.values()].filter((e) => (!S.bib.grupo || e.grupo === S.bib.grupo) && (!S.bib.posicao || e.posicao === S.bib.posicao) && (!ocultar || e.posicao !== 'deitado' || S.bib.posicao === 'deitado'))
              .filter((e) => !q || `${e.pt} ${e.en} ${e.grupo} ${e.equip}`.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().includes(q));

  const sessaoAtual = () => C().e.sessoes.get(S.treino);
  async function serieFeita(chave, n) {

    const carga = N.num($(`#s-${chave}-${n}-carga`).value.trim() || 'x');

    await campos('sessoes', S.treino, [[['exercicios', chave, 'series', n], { carga: Number.isFinite(carga) ? carga : null, reps: Number.isFinite(reps) ? reps : null, feita, hora: feita ? horaAgora() : null }]]);
    if (feita) { ativarSom(); iniciarDescanso((ex.alvo && ex.alvo.descanso) || 90, ex.nome); }

    const atual = (s.exercicios[chave] && s.exercicios[chave].series[n] || {})[serie];

  // ---------- cronômetro de descanso ----------
  const CR = { c: pref.ler('cron', null), avisado: false };
  let audio = null;
  function ativarSom() { try { if (!audio && (window.AudioContext || window.webkitAudioContext)) audio = new (window.AudioContext || window.webkitAudioContext)(); if (audio && audio.state === 'suspended') audio.resume(); } catch (e) { audio = null; } }
  function bipe() {
    if (!audio || !pref.ler('som', true)) return;
    try { [0, 0.25].forEach((t) => { const o = audio.createOscillator(); const g = audio.createGain(); o.frequency.value = 880; g.gain.value = 0.15; o.connect(g); g.connect(audio.destination); o.start(audio.currentTime + t); o.stop(audio.currentTime + t + 0.15); }); } catch (e) { /* sem som */ }
  }
  function iniciarDescanso(seg, rotulo) {
    CR.c = { ...N.cron.iniciar(seg, Date.now()), rotulo, sessao: S.treino };
    CR.avisado = false;
    pref.gravar('cron', CR.c);
    atualizarCron();
  }
  function pararDescanso() { CR.c = null; pref.apagar('cron'); atualizarCron(); }
  function atualizarCron() {
    const el = $('#cron');
    const ativo = CR.c && S.status === 'ok';
    el.hidden = !ativo;
    document.body.classList.toggle('com-cron', !!ativo);
    if (!ativo) { el.innerHTML = ''; delete el.dataset.montado; return; }
    const agora = Date.now();
    const rest = N.cron.restante(CR.c, agora);
    const pausado = CR.c.pausadoRestante != null;
    if (!el.dataset.montado) {
      el.innerHTML = `<div class="info"><div class="tempo" id="cron-tempo"></div><div class="rot" id="cron-rot"></div></div>
        <div class="botoes"><button type="button" data-cron="-15" aria-label="Menos 15 segundos">−15</button><button type="button" class="forte" data-cron="pausa" id="cron-pausa"></button><button type="button" data-cron="+15" aria-label="Mais 15 segundos">+15</button><button type="button" data-cron="fim">Pular</button></div>`;
      el.dataset.montado = '1';
    }
    const t = $('#cron-tempo');
    t.textContent = N.mmss(rest);
    t.classList.toggle('fim', rest === 0);
    $('#cron-rot').textContent = rest === 0 ? 'Descanso acabou' : `Descanso${pausado ? ' (pausado)' : ''} · ${CR.c.rotulo || ''}`;
    $('#cron-pausa').textContent = pausado ? 'Retomar' : 'Pausar';
    if (N.cron.terminou(CR.c, agora) && !CR.avisado) {
      CR.avisado = true;
      if (pref.ler('vibrar', true) && navigator.vibrate) navigator.vibrate([200, 100, 200]);
      bipe();
      if (document.hidden && pref.ler('notif', false) && window.Notification && Notification.permission === 'granted') {
        const corpo = { body: CR.c.rotulo ? `Próxima série: ${CR.c.rotulo}` : 'Hora da próxima série', tag: 'descanso' };
        if (navigator.serviceWorker && navigator.serviceWorker.ready) navigator.serviceWorker.ready.then((r) => r.showNotification('Descanso acabou', corpo)).catch(() => { try { new Notification('Descanso acabou', corpo); } catch (e) { /* sem aviso */ } });
      }
      setTimeout(() => { if (CR.c && N.cron.terminou(CR.c, Date.now())) pararDescanso(); }, 20000);
    }
  }
  setInterval(() => {
    if (CR.c) atualizarCron();
    const dec = $('#decorrido');
    const s = S.treino && sessaoAtual();
    if (dec && s) dec.textContent = N.mmss(Math.max(0, Math.round((Date.now() - new Date(s.inicio).getTime()) / 1000)));
  }, 250);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) atualizarCron(); });
  $('#cron').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-cron]'); if (!b || !CR.c) return;
    const agora = Date.now();
    const a = b.dataset.cron;
    if (a === 'fim') { pararDescanso(); return; }
    if (a === 'pausa') CR.c = { ...CR.c, ...(CR.c.pausadoRestante != null ? N.cron.retomar(CR.c, agora) : N.cron.pausar(CR.c, agora)) };
    else { CR.c = { ...CR.c, ...N.cron.ajustar(CR.c, a === '+15' ? 15 : -15, agora) }; CR.avisado = false; }

  // ---------- gráfico de peso ----------
  function desenharGraficos() {
    for (const el of $$('[data-grafico="peso"]')) {
      const w = Math.floor(el.clientWidth);
      if (w) el.innerHTML = gPeso(w);
    }
  }
  function gPeso(W) {
    const c = C();
    let pts = N.seriePeso(c.e.medidas);
    if (S.faixaPeso) { const desde = N.addDias(c.hoje, -S.faixaPeso); pts = pts.filter((p) => p.data >= desde); }
    if (!pts.length) return '<p class="mudo" style="font-size:14px">Nenhum registro neste período.</p>';
    const meta = Number(c.perfil.pesoMeta) || null;
    const H = 220, L = 44, R = 12, T = 12, B = 26;
    const vals = pts.flatMap((p) => [p.peso, p.media7]).concat(meta ? [meta] : []);
    let mn = Math.floor(Math.min(...vals) - 1), mx = Math.ceil(Math.max(...vals) + 1);
    if (mx - mn < 4) { mn -= 2; mx += 2; }
    const d0 = pts[0].data, d1 = pts[pts.length - 1].data;
    const span = Math.max(1, N.difDias(d0, d1));
    const x = (d) => L + ((W - L - R) * N.difDias(d0, d)) / span;
    const y = (v) => T + ((H - T - B) * (mx - v)) / (mx - mn);
    const passo = Math.max(1, Math.round((mx - mn) / 4));
    let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Gráfico de peso">`;
    for (let v = Math.ceil(mn); v <= mx; v += passo) s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
    if (meta && meta >= mn && meta <= mx) s += `<line x1="${L}" x2="${W - R}" y1="${y(meta)}" y2="${y(meta)}" stroke="var(--ok)" stroke-width="2" stroke-dasharray="6 5"/>`;
    s += `<path d="${pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.data).toFixed(1)},${y(p.media7).toFixed(1)}`).join('')}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    for (const p of pts) s += `<circle cx="${x(p.data)}" cy="${y(p.peso)}" r="4" fill="var(--muted)" stroke="var(--surface)" stroke-width="2"/><circle cx="${x(p.data)}" cy="${y(p.peso)}" r="12" fill="transparent" data-tip="${esc(`${N.dataLonga(p.data)}\nPeso: ${N.fmtKg(p.peso)} kg\nMédia 7 dias: ${N.fmtKg(p.media7)} kg`)}"/>`;
    s += `<text x="${L}" y="${H - 6}">${N.dataCurta(d0)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${N.dataCurta(d1)}</text>`;
    return s + '</svg>';

      document.body.appendChild(a); a.click(); a.remove();

  function oferecerSubstituicao(v, origem) {
    if (!v.ok) {
      abrirModal({ titulo: 'Este arquivo não pode ser usado', fecharNoVeu: true, corpo: `<div class="aviso perigo">${v.erros.map(esc).join('<br>')}${v.totalErros > (v.erros || []).length ? `<br>e mais ${v.totalErros - v.erros.length} problemas` : ''}</div><p class="mudo">Nada foi alterado.</p>`, rodape: '<div class="dir"><button type="button" class="botao" data-fechar>Entendi</button></div>' });
      return;
    }
    const ct = v.contagem;
    confirmar({
      titulo: origem === 'nuvem' ? 'Restaurar este backup?' : 'Importar este backup?', botao: 'Substituir meus dados', perigo: true,
      texto: `Seus dados atuais serão <b>substituídos</b> por: ${ct.diario} dias de diário, ${ct.sessoes} treinos, ${ct.fichas} fichas, ${ct.plano} refeições do plano, ${ct.medidas} medidas e ${ct.metas} versões de metas.`,
      extra: '<div class="aviso" style="margin-top:10px">Antes, um backup dos dados atuais é guardado na nuvem. Se algo der errado, restaure por ele.</div>',
    }).then(async (ok) => {
      if (!ok) return;
      const t = toast('Substituindo…', { ms: 600000 });
      try { await D.substituirTudo(v.dados, (f, tot) => { t.firstChild.textContent = `Substituindo… ${f} de ${tot}`; }); t.remove(); toast('Dados substituídos'); }
      catch (e) { t.remove(); toast('Parou no meio: ' + D.mensagemErro(e) + ' Restaure pelo backup mais recente em Ajustes.', { tipo: 'erro', ms: 12000 }); }
    });
  }

  async function aguaMenos() {
    const d = C().dia;
    const regs = Object.entries((d && d.agua && d.agua.registros) || {}).sort((a, b) => (a[0] < b[0] ? 1 : -1));
    if (regs.length) await campos('diario', S.dia, [[['agua', 'registros', regs[0][0]], D.APAGAR]]);

    agua: (d) => agua(Number(d.ml)), 'agua-menos': aguaMenos, habito: (d) => habito(d.id),
    'dia-plano': (d) => { S.diaPlano = Number(d.dia); render(); },
    'nova-refeicao': () => editarRefeicao(null), 'editar-refeicao': (d) => editarRefeicao(C().e.plano.find((r) => r.id === d.id)), 'duplicar-refeicao': (d) => editarRefeicao(C().e.plano.find((r) => r.id === d.id), true),
    'novo-alimento': () => editarAlimento(null), 'editar-alimento': (d) => editarAlimento(C().idx.get(d.id)), 'ver-base': verBase,
    'nova-ficha': () => editarFicha(null), 'editar-ficha': (d) => editarFicha(C().e.fichas.find((f) => f.id === d.id)),
    biblioteca: () => biblioteca(), guia: (d) => guia(d.id), cardio: () => registrarCardio(), 'ver-sessao': (d) => verSessao(d.id),
    comecar: (d) => comecarTreino(d.id), 'abrir-treino': (d) => abrirTreino(d.id),
    'serie-feita': (d) => serieFeita(d.chave, d.n), 'serie-mais': (d) => seriesMaisMenos(d.chave, true), 'serie-menos': (d) => seriesMaisMenos(d.chave, false),
    esforco: (d) => { const s = sessaoAtual(); if (s) campos('sessoes', S.treino, [[['exercicios', d.chave, 'esforco'], s.exercicios[d.chave].esforco === d.v ? null : d.v]]); },
    'trocar-ex': (d) => trocarExercicio(d.chave), 'add-ex-treino': addExTreino,
    'concluir-treino': concluirTreino,
    'pausar-treino': () => { S.treino = null; render(); toast('O treino fica em andamento. Continue por Hoje ou Treinos.'); },
    'interromper-treino': async () => { const s = sessaoAtual(); if (s && await confirmar({ titulo: 'Interromper o treino?', texto: 'O que foi feito fica no histórico como interrompido.', botao: 'Interromper', perigo: true })) finalizar(s, 'abandonada'); },
    medidas: (d) => editarMedidas(d.id), 'faixa-peso': (d) => { S.faixaPeso = Number(d.d); pref.gravar('faixaPeso', S.faixaPeso); render(); },
    metas: editarMetas, perfil: editarPerfil, 'habito-novo': () => editarHabito(null), 'habito-editar': (d) => editarHabito(C().e.habitos.find((h) => h.id === d.id)),
    exportar, 'backup-agora': async () => { const t = toast('Fazendo backup…', { ms: 60000 }); try { await D.criarBackup('manual'); t.remove(); toast('Backup feito na nuvem'); } catch (e) { t.remove(); toast('Backup não foi feito: ' + D.mensagemErro(e), { tipo: 'erro' }); } },
    restaurar: (d) => restaurar(d.id), 'apagar-tudo': apagarTudo,
  };
  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-acao]');
    if (!a || a.disabled) return;
    const fn = ACOES[a.dataset.acao];
    if (fn) { e.preventDefault(); fn(a.dataset, a); }
  });
  document.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-acao]')) { e.preventDefault(); e.target.click(); }
    if (e.key === 'Enter' && e.target.dataset && (e.target.dataset.serie || e.target.dataset.obs)) { e.preventDefault(); e.target.blur(); }
  });
  document.addEventListener('submit', (e) => {
    if (e.target.id === 'form-peso') { e.preventDefault(); pesoRapido(); }
    if (e.target.id === 'form-config') { e.preventDefault(); salvarConfig(); }
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.dataset && t.dataset.serie) { salvarCampoSerie(t); return; }
    if (t.dataset && t.dataset.obs) { const s = sessaoAtual(); if (s && (s.exercicios[t.dataset.obs].obs || '') !== t.value.trim()) campos('sessoes', S.treino, [[['exercicios', t.dataset.obs, 'obs'], N.validar.texto(t.value, 200)]]); return; }
    if (t.id === 'aj-som') pref.gravar('som', t.checked);
    if (t.id === 'aj-vibrar') pref.gravar('vibrar', t.checked);
    if (t.id === 'aj-notif') {
      if (t.checked && window.Notification && Notification.permission !== 'granted') Notification.requestPermission().then((p) => { pref.gravar('notif', p === 'granted'); if (p !== 'granted') { t.checked = false; toast('O navegador não permitiu notificações.', { tipo: 'erro' }); } });
      else pref.gravar('notif', t.checked);
    }
    if (t.name === 'tema') { pref.gravar('tema', t.value); aplicarTema(); }
    if (t.id === 'importar') {
      const arq = t.files && t.files[0]; t.value = '';
      if (!arq) return;
      const r = new FileReader();
      r.onload = () => { let obj; try { obj = JSON.parse(String(r.result)); } catch (err) { oferecerSubstituicao({ ok: false, erros: ['O arquivo não é um JSON válido.'] }); return; } oferecerSubstituicao(N.validarBackup(obj), 'arquivo'); };
      r.onerror = () => toast('Não foi possível ler o arquivo.', { tipo: 'erro' });
      r.readAsText(arq);
    }
  });
  function aplicarTema() {
    const t = pref.ler('tema', 'auto');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
    setTimeout(desenharGraficos, 0);
  }

  // ====================================================================
  // INÍCIO
  // ====================================================================
  $('#marca-selo').innerHTML = ic('treinos');
  $('[data-acao="dia-ant"]').innerHTML = ic('esq');
  $('[data-acao="dia-prox"]').innerHTML = ic('dir');
  aplicarTema();
  render();
  let backupFeito = false, tCarga = null;
  function aoMudarDados() {
    _c = null;
    if (S.status === 'carregando' && D.usuario && D.erroInicial) S.status = 'erro';
    if (S.status === 'carregando' && D.usuario && D.pronto) S.status = D.estado.perfil && D.estado.perfil.configurado ? 'ok' : 'config';
    if (S.status === 'ok' && D.pronto && !D.estado.perfil) S.status = 'config';
    if (S.status === 'config' && D.estado.perfil && D.estado.perfil.configurado) S.status = 'ok';
    if (S.status === 'ok' && !S.treino && CR.c && CR.c.sessao && D.estado.sessoes.get(CR.c.sessao) && D.estado.sessoes.get(CR.c.sessao).status !== 'andamento') pararDescanso();
    render();
    if (D.pronto && S.status === 'ok' && !backupFeito) { backupFeito = true; setTimeout(() => D.backupDiario().catch((e) => console.warn('backup diário', e)), 4000); }
  }
  D.ouvir(aoMudarDados);
  D.ouvirConta((u) => {
    backupFeito = false; _c = null; S.treino = null;
    clearTimeout(tCarga);
    pilha.slice().forEach((v) => fecharModal(v));
    if (!u) { S.status = 'login'; render(); return; }
    S.status = 'carregando'; render();
    tCarga = setTimeout(() => { if (S.status === 'carregando') { S.status = D.estado.perfil && D.estado.perfil.configurado ? 'ok' : 'config'; render(); } }, 9000);
  });
  D.aoErroTardio = (e) => toast('Um registro feito sem internet foi recusado pelo servidor: ' + D.mensagemErro(e), { tipo: 'erro', ms: 10000 });
  addEventListener('online', () => { renderSync(); toast('Conexão de volta. Sincronizando.'); });
  addEventListener('offline', () => { renderSync(); toast('Sem internet. Continue registrando: tudo fica no aparelho e sobe quando a conexão voltar.', { ms: 6000 }); });
  try { if (!D.iniciar(window.firebase, window.FIREBASE_CONFIG)) { S.status = 'sem-config'; render(); } } catch (e) { console.error(e); D.erroInicial = D.mensagemErro(e); S.status = 'erro'; render(); }
  if (!window.__DEMO && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
