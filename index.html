<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Dieta, treino e evolução: checklist de refeições, registro de séries e cargas, cronômetro de descanso, peso e medidas.">
<meta name="theme-color" content="#c2410c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rotina Fit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icones/icone-192.png">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<title>Rotina Fit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: celular primeiro (uso na academia). Barra inferior com 5 abas; no computador vira lateral.
   Cronômetro de descanso fixo acima da barra. Números em fonte mono tabular. */
:root {
  --bg: #f2f3f5; --surface: #ffffff; --surface-2: #eceef1; --ink: #17191c; --ink-2: #474c53; --muted: #727983;
  --line: #e0e3e7; --line-2: #c9cdd3;
  --accent: #c2410c; --accent-2: #fdebe1; --accent-ink: #ffffff;
  --ok: #157347; --ok-bg: #e0f2e7; --warn: #8a5a00; --warn-bg: #fbefd2; --bad: #b42318; --bad-bg: #fde4e1; --neutro-bg: #e8eaee;
  --mp: #2a78d6; --mc: #b97a00; --mg: #d55181;
  --sombra: 0 1px 2px rgb(20 22 26 / 6%), 0 6px 20px rgb(20 22 26 / 6%);
  --veu: rgb(20 22 26 / 45%);
  --f-ui: 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-num: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
  --r: 14px; --r-sm: 10px; --toque: 44px;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1113; --surface: #171a1d; --surface-2: #1f2327; --ink: #eceff2; --ink-2: #b1b7be; --muted: #838a93;
    --line: #272b30; --line-2: #363b41;
    --accent: #fb8a4c; --accent-2: #3a2216; --accent-ink: #1a0d05;
    --ok: #4cc386; --ok-bg: #13301f; --warn: #f0b64b; --warn-bg: #392b0f; --bad: #ff8d80; --bad-bg: #431a1a; --neutro-bg: #22262b;
    --mp: #5aa0ee; --mc: #eda100; --mg: #e87ba4;
    --sombra: 0 1px 0 rgb(0 0 0 / 35%); --veu: rgb(0 0 0 / 60%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1113; --surface: #171a1d; --surface-2: #1f2327; --ink: #eceff2; --ink-2: #b1b7be; --muted: #838a93;
  --line: #272b30; --line-2: #363b41;
  --accent: #fb8a4c; --accent-2: #3a2216; --accent-ink: #1a0d05;
  --ok: #4cc386; --ok-bg: #13301f; --warn: #f0b64b; --warn-bg: #392b0f; --bad: #ff8d80; --bad-bg: #431a1a; --neutro-bg: #22262b;
  --mp: #5aa0ee; --mc: #eda100; --mg: #e87ba4;
  --sombra: 0 1px 0 rgb(0 0 0 / 35%); --veu: rgb(0 0 0 / 60%);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font-family: var(--f-ui); font-size: 15.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
img { max-width: 100%; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.mudo { color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- moldura ---------- */
.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }
.lateral { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; padding: 22px 12px; border-right: 1px solid var(--line); background: var(--surface); }
.marca { display: flex; align-items: center; gap: 10px; padding: 2px 10px 18px; }
.marca-selo { width: 32px; height: 32px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.marca-selo svg { width: 20px; height: 20px; }
.marca b { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
.nav-item { display: flex; align-items: center; gap: 11px; width: 100%; min-height: var(--toque); padding: 0 12px; border: 0; border-radius: var(--r-sm); background: none; color: var(--ink-2); font-weight: 600; font-size: 15px; cursor: pointer; text-align: left; }
.nav-item svg { width: 20px; height: 20px; flex: none; }
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item[aria-current="page"] { background: var(--accent-2); color: var(--accent); }
.lateral .rodape { margin-top: auto; padding: 12px 4px 0; }
.principal { min-width: 0; padding-inline: 28px; padding-block: 0 56px; }
.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; padding-block: 16px 12px; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); max-width: 1000px; margin-inline: auto; }
.topo h1 { font-size: 24px; font-weight: 800; }
.topo .dir { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
main { max-width: 1000px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
.seletor-dia { display: flex; align-items: center; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seletor-dia button { border: 0; background: none; border-radius: 999px; height: 36px; min-width: 36px; display: grid; place-items: center; cursor: pointer; color: var(--ink-2); }
.seletor-dia button svg { width: 18px; height: 18px; }
.seletor-dia .rotulo { min-width: 112px; text-align: center; font-weight: 700; font-size: 14px; }
.seletor-dia .hoje { font-size: 12.5px; font-weight: 800; color: var(--accent); padding-inline: 10px; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--muted); padding: 5px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.sync.sincronizando i { background: var(--warn); animation: pulsar 1s ease-in-out infinite; }
.sync.offline i { background: var(--muted); }
@keyframes pulsar { 50% { opacity: .35; } }
.inferior { display: none; }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .lateral { display: none; }
  .principal { padding-inline: 16px; padding-block: 0 calc(104px + env(safe-area-inset-bottom, 0px)); }
  .topo { padding-block: 10px 8px; }
  .topo h1 { font-size: 21px; }
  .inferior { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding: 4px 2px calc(4px + env(safe-area-inset-bottom, 0px)); }
  .inferior button { flex: 1; min-width: 0; min-height: 56px; border: 0; background: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 700; cursor: pointer; }
  .inferior button svg { width: 23px; height: 23px; }
  .inferior button[aria-current="page"] { color: var(--accent); }
  body.com-cron .principal { padding-block-end: calc(150px + env(safe-area-inset-bottom, 0px)); }
}
body.fora .lateral, body.fora .inferior, body.fora .topo { display: none; }
body.fora .app { grid-template-columns: minmax(0, 1fr); }

/* ---------- blocos ---------- */
.cartao { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.cartao-cab { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.cartao-cab h2 { font-size: 16.5px; font-weight: 800; }
.cartao-cab small { color: var(--muted); font-size: 13px; }
.grade-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 860px) { .grade-2 { grid-template-columns: minmax(0, 1fr); } }
.rotulo-mini { font-size: 11.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.aviso { padding: 11px 13px; border-radius: var(--r-sm); background: var(--accent-2); color: var(--ink); font-size: 14px; }
.aviso.neutro { background: var(--surface-2); color: var(--ink-2); }
.aviso.perigo { background: var(--bad-bg); color: var(--bad); }
.vazio { text-align: center; padding: 22px 12px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.vazio strong { color: var(--ink); font-size: 15.5px; }
.sep { height: 1px; background: var(--line); margin: 6px 0; }

/* ---------- botões e campos ---------- */
.botao { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: var(--toque); padding: 0 16px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-weight: 700; font-size: 14.5px; cursor: pointer; white-space: nowrap; }
.botao:hover { background: var(--surface-2); }
.botao svg { width: 18px; height: 18px; }
.botao.primario { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.botao.primario:hover { filter: brightness(1.06); }
.botao.perigo { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line-2)); }
.botao.perigo.cheio { background: var(--bad); color: #fff; border-color: var(--bad); }
.botao.fantasma { border-color: transparent; background: none; color: var(--accent); padding-inline: 10px; }
.botao.fantasma:hover { background: var(--accent-2); }
.botao.peq { min-height: 36px; padding: 0 12px; font-size: 13.5px; }
.botao.largo { width: 100%; }
.botao:disabled { opacity: .5; cursor: not-allowed; }
.linha-botoes { display: flex; gap: 8px; flex-wrap: wrap; }
.campos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.campos.tres { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.campos.quatro { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.campos .largo { grid-column: 1 / -1; }
@media (max-width: 520px) { .campos.quatro { grid-template-columns: repeat(2, minmax(0, 1fr)); } .campos.tres { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.campo { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.campo > span, fieldset.campo > legend { font-size: 13px; font-weight: 700; color: var(--ink-2); padding: 0; }
fieldset.campo { border: 0; margin: 0; padding: 0; }
.campo input, .campo select, .campo textarea, .entrada { min-height: var(--toque); padding: 0 12px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--surface); width: 100%; min-width: 0; font-size: 16px; }
.campo textarea { padding: 10px 12px; min-height: 80px; resize: vertical; }
.campo input:focus, .campo select:focus, .campo textarea:focus, .entrada:focus { outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 0; border-color: var(--accent); }
.campo .dica { font-size: 12.5px; color: var(--muted); }
.erro-campo { color: var(--bad); font-size: 14px; font-weight: 700; }
.erro-campo:empty { display: none; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; cursor: pointer; margin: 0; }
.chip > span { display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--ink-2); background: var(--surface); }
.chip input:checked + span { border-color: var(--accent); background: var(--accent-2); color: var(--ink); }
.chip input:focus-visible + span { outline: 2px solid var(--accent); }
.chip-botao { min-height: 38px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--ink-2); background: var(--surface); cursor: pointer; }
.chip-botao[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-2); color: var(--ink); }
.check { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; cursor: pointer; min-height: var(--toque); }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 800; white-space: nowrap; background: var(--neutro-bg); color: var(--ink-2); }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.acento { background: var(--accent-2); color: var(--accent); }

/* ---------- resumo do dia ---------- */
.resumo { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 18px; align-items: center; }
.anel { position: relative; width: 150px; height: 150px; }
.anel svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.anel .centro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.anel .centro b { font-family: var(--f-num); font-size: 26px; letter-spacing: -0.04em; }
.anel .centro small { font-size: 12.5px; color: var(--muted); }
.macros { display: flex; flex-direction: column; gap: 12px; }
.macro .info { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; margin-bottom: 5px; }
.macro .info b { font-family: var(--f-num); font-weight: 700; }
.barra { height: 9px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.barra > i { display: block; height: 100%; border-radius: 999px; background: var(--accent); max-width: 100%; }
@media (max-width: 420px) { .resumo { grid-template-columns: 116px minmax(0, 1fr); gap: 14px; } .anel { width: 116px; height: 116px; } .anel .centro b { font-size: 21px; } }

/* ---------- checklist de refeições ---------- */
.refeicao-cab { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.refeicao-cab h3 { font-size: 16px; font-weight: 800; }
.refeicao-cab small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.item { display: grid; grid-template-columns: var(--toque) minmax(0, 1fr) auto 40px; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); min-height: 56px; }
.item:first-of-type { border-top: 0; }
.marcar { width: var(--toque); height: var(--toque); border-radius: 50%; border: 2px solid var(--line-2); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: transparent; padding: 0; }
.marcar svg { width: 22px; height: 22px; }
.marcar.comido { background: var(--ok); border-color: var(--ok); color: #fff; }
.marcar.parcial { border-color: var(--warn); color: var(--warn); background: var(--warn-bg); }
.marcar.trocado { border-color: var(--accent); color: var(--accent); background: var(--accent-2); }
.item .nome { min-width: 0; }
.item .nome strong { display: block; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .nome small { display: block; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .kcal { font-family: var(--f-num); font-size: 13.5px; color: var(--ink-2); text-align: right; white-space: nowrap; }
.mais-op { width: 40px; height: 40px; border-radius: 10px; border: 0; background: none; cursor: pointer; color: var(--muted); display: grid; place-items: center; }
.mais-op:hover { background: var(--surface-2); color: var(--ink); }
.mais-op svg { width: 20px; height: 20px; }
.item.extra .marcar { border-style: dashed; }

/* ---------- água e hábitos ---------- */
.agua { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.agua .valor { font-family: var(--f-num); font-size: 22px; font-weight: 700; }
.agua .barra { flex: 1; min-width: 120px; }

/* ---------- listas simples ---------- */
.linha-lista { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); min-height: 52px; min-width: 0; }
.linha-lista:first-child { border-top: 0; }
.linha-lista .esq { min-width: 0; display: flex; align-items: center; gap: 10px; }
.linha-lista .esq > div { min-width: 0; }
.linha-lista strong { display: block; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.linha-lista small { display: block; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.linha-lista .dir { display: flex; align-items: center; gap: 8px; flex: none; }
.clicavel { cursor: pointer; border-radius: 8px; }
.clicavel:hover { background: var(--surface-2); }
.miniatura { width: 46px; height: 46px; border-radius: 10px; background: #fff; border: 1px solid var(--line); object-fit: contain; flex: none; display: grid; place-items: center; color: #5b616a; overflow: hidden; }
.miniatura svg { width: 24px; height: 24px; color: var(--accent); }
.miniatura.icone { background: var(--accent-2); border-color: transparent; }

/* ---------- treino ---------- */
.ex-cartao .cab { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.ex-cartao h3 { font-size: 16.5px; font-weight: 800; }
.ex-cartao .alvo { font-size: 13px; color: var(--muted); margin-top: 2px; }
.ex-cartao .ultima { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
.series { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.serie { display: grid; grid-template-columns: 30px minmax(0, 1fr) minmax(0, 1fr) 56px; gap: 8px; align-items: center; }
.serie .n { font-family: var(--f-num); font-weight: 700; color: var(--muted); text-align: center; }
.serie label { position: relative; display: block; }
.serie input { width: 100%; min-height: 48px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--surface); text-align: center; font-family: var(--f-num); font-size: 18px; font-weight: 700; padding: 0 30px 0 8px; }
.serie label i { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-style: normal; font-size: 12px; color: var(--muted); pointer-events: none; }
.serie .feita { width: 56px; height: 48px; border-radius: var(--r-sm); border: 2px solid var(--line-2); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--muted); }
.serie .feita svg { width: 24px; height: 24px; }
.serie.ok .feita { background: var(--ok); border-color: var(--ok); color: #fff; }
.serie.ok input { border-color: color-mix(in srgb, var(--ok) 45%, var(--line-2)); }
.esforco { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.cron { position: fixed; left: 0; right: 0; bottom: 0; z-index: 24; background: var(--ink); color: var(--bg); padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 10px; justify-content: center; flex-wrap: nowrap; box-shadow: 0 -6px 24px rgb(0 0 0 / 18%); }
.cron .info { min-width: 0; display: flex; flex-direction: column; }
.cron .tempo { font-family: var(--f-num); font-size: 34px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
.cron .tempo.fim { color: var(--accent); }
.cron .rot { font-size: 12px; opacity: .8; max-width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cron .botoes { display: flex; gap: 6px; flex: none; }
.cron button { min-height: 46px; min-width: 46px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--bg) 30%, transparent); background: transparent; color: inherit; font-weight: 800; font-size: 14.5px; cursor: pointer; padding: 0 9px; }
@media (max-width: 380px) { .cron .tempo { font-size: 28px; } .cron button { padding: 0 7px; min-width: 42px; } .cron .rot { max-width: 96px; } }
.cron button.forte { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
@media (max-width: 860px) { .cron { bottom: calc(64px + env(safe-area-inset-bottom, 0px)); padding-bottom: 10px; } }
@media (min-width: 861px) { .cron { left: 220px; } }

/* ---------- guia de exercício ---------- */
.quadros { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.quadros figure { margin: 0; background: #fff; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.quadros img { max-height: 220px; object-fit: contain; }
.quadros figcaption { font-size: 12px; color: #5b616a; font-weight: 700; }
.credito { font-size: 12px; color: var(--muted); }
.credito a { color: inherit; }
.guia h3 { font-size: 14.5px; font-weight: 800; margin-bottom: 6px; }
.guia ol, .guia ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 5px; }
.guia section { display: flex; flex-direction: column; gap: 4px; }

/* ---------- gráfico ---------- */
.grafico { width: 100%; position: relative; }
.grafico svg { display: block; width: 100%; height: auto; overflow: visible; }
.grafico text { font-family: var(--f-ui); font-size: 11.5px; fill: var(--muted); }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); margin-top: 8px; }
.legenda span { display: inline-flex; align-items: center; gap: 6px; }
.legenda i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.tabela-wrap { overflow-x: auto; }
table.dados { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.dados th, table.dados td { padding: 8px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.dados th:first-child, table.dados td:first-child { text-align: left; }
table.dados th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
table.dados td { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 860px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi .valor { font-family: var(--f-num); font-size: 22px; font-weight: 700; letter-spacing: -0.03em; }
.kpi .det { font-size: 12.5px; color: var(--muted); }
.tip { position: fixed; z-index: 80; pointer-events: none; background: var(--ink); color: var(--bg); padding: 7px 10px; border-radius: 8px; font-size: 12.5px; white-space: pre-line; max-width: 240px; }

/* ---------- modal e avisos ---------- */
.veu { position: fixed; inset: 0; z-index: 60; background: var(--veu); display: flex; align-items: center; justify-content: center; padding: 24px 16px; animation: aparecer .14s ease-out; }
.modal { background: var(--surface); border-radius: 18px; width: min(560px, 100%); max-height: calc(100vh - 48px); display: flex; flex-direction: column; box-shadow: 0 20px 60px rgb(0 0 0 / 28%); animation: subir .18s ease-out; }
.modal.largo { width: min(760px, 100%); }
.modal-cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px 8px; }
.modal-cab h2 { font-size: 18.5px; font-weight: 800; }
.fechar { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface-2); cursor: pointer; display: grid; place-items: center; color: var(--ink-2); flex: none; }
.fechar svg { width: 18px; height: 18px; }
.modal-corpo { padding: 8px 18px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.modal-rodape { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 12px 18px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
.modal-rodape .dir { display: flex; gap: 10px; margin-left: auto; }
@media (max-width: 620px) { .veu { align-items: flex-end; padding: 0; } .modal, .modal.largo { width: 100%; border-radius: 20px 20px 0 0; max-height: 94vh; } }
@keyframes aparecer { from { opacity: 0; } }
@keyframes subir { from { transform: translateY(16px); opacity: 0; } }
#toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 90; display: flex; flex-direction: column; gap: 8px; width: min(460px, calc(100% - 32px)); }
.toast { background: var(--ink); color: var(--bg); padding: 12px 14px; border-radius: 12px; font-size: 14.5px; font-weight: 600; display: flex; align-items: center; gap: 14px; box-shadow: 0 8px 28px rgb(0 0 0 / 25%); animation: subir .18s ease-out; }
.toast.erro { background: var(--bad); color: #fff; }
.toast button { margin-left: auto; border: 0; background: none; color: inherit; font-weight: 800; text-decoration: underline; cursor: pointer; min-height: 36px; }
@media (max-width: 860px) { #toasts { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); } body.com-cron #toasts { bottom: calc(160px + env(safe-area-inset-bottom, 0px)); } }

/* ---------- telas inteiras ---------- */
.tela-centro { min-height: 70vh; display: grid; place-items: center; text-align: center; padding: 24px 0; }
.tela-centro > div { max-width: 440px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.tela-centro h2 { font-size: 21px; font-weight: 800; }
.carregando { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--line-2); border-top-color: var(--accent); animation: girar .8s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }
.tela-login { min-height: 100vh; display: grid; place-items: center; padding-block: 24px; }
.cartao-login { width: min(460px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 30px 26px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--sombra); }
.cartao-login h2 { font-size: 25px; font-weight: 800; line-height: 1.15; }
.cartao-login p { color: var(--ink-2); }
.cartao-login .letra-miuda { font-size: 12.5px; color: var(--muted); }
.botao.entrar { min-height: 52px; font-size: 16px; gap: 10px; }
.config-inicial { max-width: 640px; margin: 24px auto; display: flex; flex-direction: column; gap: 16px; }
.config-inicial h2 { font-size: 24px; font-weight: 800; }
.usuario { display: flex; align-items: center; gap: 10px; min-width: 0; }
.usuario .avatar { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; background: var(--accent-2); color: var(--accent); display: grid; place-items: center; font-weight: 800; flex: none; }
.usuario .avatar img { width: 100%; height: 100%; object-fit: cover; }
.usuario .quem { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.usuario .quem strong { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.usuario .quem small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--accent); color: var(--accent-ink); border-radius: var(--r); padding: 14px 16px; }
.banner strong { font-size: 15.5px; }
.banner .botao { background: var(--accent-ink); color: var(--accent); border-color: transparent; }
.dias-semana { display: flex; gap: 6px; flex-wrap: wrap; }
</style>
</head>
<body>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<div class="app">
  <aside class="lateral" aria-label="Navegação">
    <div class="marca"><div class="marca-selo" id="marca-selo"></div><b>Rotina Fit</b></div>
    <nav id="nav-lateral" style="display:flex;flex-direction:column;gap:2px"></nav>
    <div class="rodape" id="rodape-lateral"></div>
  </aside>
  <div class="principal">
    <header class="topo">
      <h1 id="titulo-aba">Hoje</h1>
      <div class="dir">
        <div class="seletor-dia" id="seletor-dia" hidden>
          <button type="button" data-acao="dia-ant" aria-label="Dia anterior"></button>
          <div class="rotulo" id="rotulo-dia"></div>
          <button type="button" data-acao="dia-prox" aria-label="Próximo dia"></button>
          <button type="button" class="hoje" data-acao="dia-hoje">Hoje</button>
        </div>
        <span class="sync" id="sync" role="status" aria-live="polite"><i></i><span>Salvo</span></span>
      </div>
    </header>
    <main id="conteudo"></main>
  </div>
</div>
<nav class="inferior" id="nav-inferior" aria-label="Navegação"></nav>
<div class="cron" id="cron" hidden role="timer" aria-live="off"></div>
<div id="modal-raiz"></div>
<div id="toasts" aria-live="polite"></div>
<div id="tip" class="tip" hidden></div>
<script>/* Núcleo do Rotina Fit: funções puras (sem DOM e sem banco), testadas no Node.
   Datas "AAAA-MM-DD"; pesos em kg; alimentos com valores por 100 g; macros {kcal, p, c, g}. */
(function (raiz) {
  'use strict';
  const N = {};

  // ---------- datas ----------
  const pad = (n) => String(n).padStart(2, '0');
  N.isoDe = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  N.hoje = () => N.isoDe(new Date());
  N.dataValida = (iso) => {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(iso || ''))) return false;
    const [a, m, d] = iso.split('-').map(Number);
    return N.isoDe(new Date(a, m - 1, d)) === iso;
  };
  N.addDias = (iso, n) => { const [a, m, d] = iso.split('-').map(Number); return N.isoDe(new Date(a, m - 1, d + n)); };
  N.difDias = (a, b) => { const p = (s) => { const [x, y, z] = s.split('-').map(Number); return Date.UTC(x, y - 1, z); }; return Math.round((p(b) - p(a)) / 86400000); };
  /** 0 = domingo … 6 = sábado */
  N.diaSemana = (iso) => { const [a, m, d] = iso.split('-').map(Number); return new Date(a, m - 1, d).getDay(); };
  N.DIAS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
  N.DIAS_LONGOS = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
  const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  N.dataCurta = (iso) => (iso ? `${Number(iso.slice(8, 10))} ${MESES[Number(iso.slice(5, 7)) - 1]}` : '');
  N.dataLonga = (iso) => (iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}` : '');
  /** Segunda-feira da semana da data. */
  N.inicioSemana = (iso) => N.addDias(iso, -((N.diaSemana(iso) + 6) % 7));

  // ---------- números ----------
  /** "1,5" | "1.5" | "80" -> número; NaN se inválido. Aceita vírgula decimal. */
  N.num = (txt) => {
    if (typeof txt === 'number') return Number.isFinite(txt) ? txt : NaN;
    const s = String(txt == null ? '' : txt).trim().replace(/\s/g, '').replace(',', '.');
    if (!s || !/^-?\d+(\.\d+)?$/.test(s)) return NaN;
    return Number(s);
  };
  N.r1 = (x) => Math.round((Number(x) || 0) * 10) / 10;
  N.r0 = (x) => Math.round(Number(x) || 0);
  N.fmt = (x, casas = 0) => (Number(x) || 0).toLocaleString('pt-BR', { minimumFractionDigits: casas, maximumFractionDigits: casas });
  N.fmtKg = (x) => (Number.isFinite(Number(x)) ? (Number(x) % 1 ? N.fmt(x, 1) : N.fmt(x, 0)) : '—');

  // ---------- alimentos e macros ----------
  const ZERO = () => ({ kcal: 0, p: 0, c: 0, g: 0 });
  /** Macros de `gramas` de um alimento (valores por 100 g). */
  N.macrosDe = (alimento, gramas) => {
    const f = (Number(gramas) || 0) / 100;
    const b = (alimento && alimento.por100) || {};
    return { kcal: N.r0((b.kcal || 0) * f), p: N.r1((b.p || 0) * f), c: N.r1((b.c || 0) * f), g: N.r1((b.g || 0) * f) };
  };
  N.somar = (lista) => {
    const t = ZERO();
    for (const m of lista) { if (!m) continue; t.kcal += m.kcal || 0; t.p += m.p || 0; t.c += m.c || 0; t.g += m.g || 0; }
    return { kcal: N.r0(t.kcal), p: N.r1(t.p), c: N.r1(t.c), g: N.r1(t.g) };
  };
  /** Junta a base estática com os alimentos do usuário (os dele substituem os da base pelo mesmo id). */
  N.indiceAlimentos = (base, meus) => {
    const m = new Map();
    for (const a of base || []) m.set(a.id, { ...a, daBase: true });
    for (const a of meus || []) if (!a.excluido) m.set(a.id, { ...a, daBase: false, editadoDaBase: m.has(a.id) || !!a.editadoDaBase });
    for (const a of meus || []) if (a.excluido) m.delete(a.id);
    return m;
  };
  /** Converte quantidade + unidade em gramas. Unidade 'g' (ou 'ml', tratado como g) ou o nome de uma unidade do alimento. */
  N.gramasDe = (alimento, qtd, unidade) => {
    const q = Number(qtd) || 0;
    if (!unidade || unidade === 'g' || unidade === 'ml') return q;
    const u = ((alimento && alimento.unidades) || []).find((x) => x.nome === unidade);
    return u ? q * u.gramas : q;
  };
  N.textoQtd = (qtd, unidade) => {
    const q = N.fmt(qtd, Number(qtd) % 1 ? 1 : 0);
    if (!unidade || unidade === 'g') return `${q} g`;
    if (unidade === 'ml') return `${q} ml`;
    return `${q} ${unidade}${Number(qtd) > 1 && !/s$/.test(unidade) && !unidade.includes(' ') ? 's' : ''}`;
  };

  // ---------- receitas (Etapa 2 usa; o cálculo já fica pronto) ----------
  /** Macros totais e por 100 g de uma receita a partir dos ingredientes. */
  N.macrosReceita = (receita, indice) => {
    const partes = (receita.ingredientes || []).map((i) => N.macrosDe(indice.get(i.alimentoId), i.gramas));
    const total = N.somar(partes);
    const pesoCru = N.soma((receita.ingredientes || []).map((i) => Number(i.gramas) || 0));
    const pesoFinal = Number(receita.pesoFinal) > 0 ? Number(receita.pesoFinal) : pesoCru;
    const por100 = pesoFinal > 0 ? { kcal: total.kcal * 100 / pesoFinal, p: total.p * 100 / pesoFinal, c: total.c * 100 / pesoFinal, g: total.g * 100 / pesoFinal } : ZERO();
    const porcoes = Math.max(1, Number(receita.porcoes) || 1);
    return { total, por100, pesoFinal, porcao: { gramas: pesoFinal / porcoes, ...N.somar([{ kcal: total.kcal / porcoes, p: total.p / porcoes, c: total.c / porcoes, g: total.g / porcoes }]) } };
  };
  N.soma = (arr) => arr.reduce((t, x) => t + x, 0);

  // ---------- metas versionadas ----------
  /** Meta vigente numa data: a versão com maior `vigenteDesde` <= data. */
  N.metaVigente = (metas, data) => {
    let melhor = null;
    for (const m of metas || []) {
      if (!m.vigenteDesde || m.vigenteDesde > data) continue;
      if (!melhor || m.vigenteDesde > melhor.vigenteDesde || (m.vigenteDesde === melhor.vigenteDesde && (m.criadoEm || '') > (melhor.criadoEm || ''))) melhor = m;
    }
    return melhor;
  };

  // ---------- plano alimentar e diário ----------
  N.planoDoDia = (plano, data) => {
    const ds = N.diaSemana(data);
    return (plano || []).filter((r) => (r.dias || []).includes(ds)).sort((a, b) => (a.horario || '99:99').localeCompare(b.horario || '99:99') || (a.nome || '').localeCompare(b.nome || ''));
  };
  N.consumosDoDia = (diaDoc) => Object.entries((diaDoc && diaDoc.consumo) || {}).map(([id, e]) => ({ ...e, id })).sort((a, b) => (a.hora || '').localeCompare(b.hora || '') || (a.criadoEm || '').localeCompare(b.criadoEm || ''));
  N.totaisDia = (diaDoc) => N.somar(N.consumosDoDia(diaDoc).map((e) => e.macros));

  /** Registro de consumo (cópia completa: nome, preparo, gramas e macros do momento). */
  N.registroConsumo = ({ id, alimento, gramas, textoQtd, origem, refeicao, planoItemId, substituiu, hora, agora }) => ({
    id,
    origem: origem || 'extra',
    refeicao: refeicao || null,
    planoItemId: planoItemId || null,
    substituiu: substituiu || null,
    alimentoId: alimento.id,
    nome: alimento.nome,
    preparo: alimento.preparo || '',
    fonte: alimento.fonte || '',
    gramas: N.r1(gramas),
    textoQtd: textoQtd || N.textoQtd(gramas, 'g'),
    macros: N.macrosDe(alimento, gramas),
    hora: hora || '',
    criadoEm: agora || new Date().toISOString(),
  });

  /** Situação de um item planejado no dia: pendente, comido, parcial, trocado. */
  N.situacaoItem = (item, consumos) => {
    const ligados = consumos.filter((e) => e.planoItemId === item.id);
    if (!ligados.length) return { estado: 'pendente', registros: [] };
    if (ligados.some((e) => e.origem === 'substituto')) return { estado: 'trocado', registros: ligados };
    const g = N.soma(ligados.map((e) => e.gramas || 0));
    const plan = Number(item.gramas) || 0;
    if (plan > 0 && g < plan * 0.95) return { estado: 'parcial', registros: ligados, fracao: g / plan };
    return { estado: 'comido', registros: ligados, fracao: plan > 0 ? g / plan : 1 };
  };
  /** Macros planejados de uma refeição (calculados agora, a partir da biblioteca atual). */
  N.macrosRefeicao = (ref, indice) => N.somar((ref.itens || []).map((i) => N.macrosDe(indice.get(i.alimentoId), i.gramas)));

  // ---------- água, hábitos, constância (neutra, sem punição) ----------
  /** Água do dia: cada copo é um registro próprio (dois aparelhos somam, não se sobrescrevem). */
  N.aguaTotal = (d) => (Number(d && d.agua && d.agua.ml) || 0) + N.soma(Object.values((d && d.agua && d.agua.registros) || {}).map((r) => Number(r.ml) || 0));
  N.resumoSemana = ({ dias, sessoes, metas, hoje }) => {
    const datas = Array.from({ length: 7 }, (_, i) => N.addDias(hoje, i - 6));
    const porData = new Map((dias || []).map((d) => [d.data, d]));
    let registrados = 0, aguaOk = 0;
    for (const dt of datas) {
      const d = porData.get(dt);
      if (d && Object.keys(d.consumo || {}).length) registrados++;
      const meta = N.metaVigente(metas, dt);
      if (d && meta && meta.aguaMl > 0 && N.aguaTotal(d) >= meta.aguaMl) aguaOk++;
    }
    const inicio = N.inicioSemana(hoje);
    const daSemana = (sessoes || []).filter((s) => s.status === 'concluida' && s.data >= inicio && s.data <= hoje);
    return {
      diasComRegistro: registrados,
      diasAguaOk: aguaOk,
      treinosSemana: daSemana.filter((s) => s.tipo !== 'cardio').length,
      cardioMinSemana: N.soma(daSemana.filter((s) => s.tipo === 'cardio').map((s) => Number(s.minutos) || 0)),
      diasAtivosSemana: new Set(daSemana.map((s) => s.data)).size,
    };
  };

  // ---------- peso e medidas ----------
  /** Pontos de peso (um por dia, o último registro do dia) com média móvel dos últimos 7 dias corridos. */
  N.seriePeso = (medidas) => {
    const porDia = new Map();
    for (const m of (medidas || []).slice().sort((a, b) => (a.data + (a.criadoEm || '') < b.data + (b.criadoEm || '') ? -1 : 1))) {
      if (Number(m.peso) > 0) porDia.set(m.data, Number(m.peso));
    }
    const pts = [...porDia.entries()].sort((a, b) => (a[0] < b[0] ? -1 : 1)).map(([data, peso]) => ({ data, peso }));
    return pts.map((p) => {
      const janela = pts.filter((q) => q.data <= p.data && N.difDias(q.data, p.data) < 7);
      return { ...p, media7: N.r1(N.soma(janela.map((q) => q.peso)) / janela.length) };
    });
  };
  N.progressoPeso = (perfil, serie) => {
    const ini = Number(perfil && perfil.pesoInicial) || (serie[0] && serie[0].peso) || null;
    const ult = serie.length ? serie[serie.length - 1] : null;
    const meta = Number(perfil && perfil.pesoMeta) || null;
    if (!ini || !ult) return { inicial: ini, atual: ult ? ult.peso : null, media7: ult ? ult.media7 : null, variacao: null, falta: null, fracao: null, meta };
    const variacao = N.r1(ult.media7 - ini);
    const falta = meta ? N.r1(ult.media7 - meta) : null;
    const fracao = meta && ini !== meta ? Math.max(0, Math.min(1, (ini - ult.media7) / (ini - meta))) : null;
    return { inicial: ini, atual: ult.peso, media7: ult.media7, variacao, falta, fracao, meta };
  };
  N.MEDIDAS = [['cintura', 'Cintura'], ['abdomen', 'Abdômen'], ['quadril', 'Quadril'], ['peito', 'Peito'], ['braco', 'Braço'], ['coxa', 'Coxa'], ['panturrilha', 'Panturrilha']];
  /** Variação de cada medida entre o primeiro e o último registro que a têm. */
  N.variacaoMedidas = (medidas) => {
    const ord = (medidas || []).slice().sort((a, b) => (a.data < b.data ? -1 : 1));
    const r = {};
    for (const [k] of N.MEDIDAS) {
      const com = ord.filter((m) => Number(m[k]) > 0);
      if (com.length) r[k] = { primeira: Number(com[0][k]), ultima: Number(com[com.length - 1][k]), dif: N.r1(com[com.length - 1][k] - com[0][k]), desde: com[0].data };
    }
    return r;
  };

  // ---------- treino ----------
  /** Cria a sessão a partir da ficha, com carga e repetições da última vez (ou o alvo da ficha). */
  N.novaSessao = ({ id, ficha, ultimas, nomeDe, data, agora }) => {
    const exercicios = {};
    (ficha.exercicios || []).forEach((ex, i) => {
      const ult = (ultimas || {})[ex.exercicioId];
      const n = Math.max(1, Math.min(20, Number(ex.series) || 3));
      const series = {};
      for (let s = 1; s <= n; s++) {
        const u = ult && ult.series && (ult.series[s - 1] || ult.series[ult.series.length - 1]);
        series[String(s)] = { carga: u ? u.carga : (Number(ex.carga) || null), reps: u ? u.reps : (parseInt(ex.reps, 10) || null), feita: false };
      }
      exercicios[ex.chave] = { ordem: i, exercicioId: ex.exercicioId, nome: nomeDe(ex.exercicioId) || ex.nome || 'Exercício', alvo: { series: n, reps: ex.reps || '', carga: Number(ex.carga) || null, descanso: Number(ex.descanso) || 90 }, series, esforco: null, obs: '' };
    });
    return { id, tipo: 'musculacao', data, status: 'andamento', inicio: agora, fim: null, fichaId: ficha.id, fichaNome: ficha.nome, exercicios };
  };
  N.exerciciosOrdenados = (sessao) => Object.entries(sessao.exercicios || {}).map(([chave, e]) => ({ ...e, chave })).sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
  N.seriesOrdenadas = (ex) => Object.entries(ex.series || {}).map(([n, s]) => ({ ...s, n })).sort((a, b) => Number(a.n) - Number(b.n));
  N.progressoSessao = (sessao) => {
    let total = 0, feitas = 0;
    for (const ex of N.exerciciosOrdenados(sessao)) for (const s of N.seriesOrdenadas(ex)) { total++; if (s.feita) feitas++; }

  };

    const r = {};
    for (const ex of N.exerciciosOrdenados(sessao)) {
      const feitas = N.seriesOrdenadas(ex).filter((s) => s.feita);
      if (!feitas.length) continue;
      const series = feitas.map((s) => ({ carga: Number(s.carga) || 0, reps: Number(s.reps) || 0 }));
      const maior = Math.max(...series.map((s) => s.carga));

        historico: { data: sessao.data, maiorCarga: maior, repsNaMaior: Math.max(...series.filter((s) => s.carga === maior).map((s) => s.reps)), volume: N.r0(N.soma(series.map((s) => s.carga * s.reps))), series: series.length, esforco: ex.esforco || null },

    id: (v) => (N.ID.test(String(v || '')) ? v : erro('Identificador inválido.')),

    numero: (v, min, max, rotulo, opcional) => {
      if ((v === '' || v == null) && opcional) return null;
      const n = typeof v === 'number' ? v : N.num(v);
      if (!Number.isFinite(n) || n < min || n > max) erro(`${rotulo || 'Valor'} precisa estar entre ${N.fmt(min)} e ${N.fmt(max)}.`);

  };

  N.FORMATO_BACKUP = 1;
  N.hash = (txt) => { let h = 5381; for (let i = 0; i < txt.length; i++) h = ((h * 33) ^ txt.charCodeAt(i)) >>> 0; return h.toString(36); };
  N.montarBackup = (dados, agoraIso) => ({
    app: 'rotina-fit', formato: N.FORMATO_BACKUP, exportadoEm: agoraIso,
    dados: Object.fromEntries(N.COLECOES.map((c) => [c, (dados[c] || []).slice().sort((a, b) => (a.id < b.id ? -1 : 1))])),
  });
  N.hashDados = (dados) => N.hash(JSON.stringify(N.montarBackup(dados, '').dados));
  N.partir = (txt, tam) => { const r = []; for (let i = 0; i < txt.length; i += tam) r.push(txt.slice(i, i + tam)); return r.length ? r : ['']; };
  N.validarBackup = (obj) => {
    if (!obj || typeof obj !== 'object' || obj.app !== 'rotina-fit' || !obj.dados || typeof obj.dados !== 'object') return { ok: false, erros: ['O arquivo não é um backup do Rotina Fit.'] };
    if (Number(obj.formato) > N.FORMATO_BACKUP) return { ok: false, erros: ['Este backup foi feito por uma versão mais nova do app.'] };
    const erros = [];
    const dados = {}, contagem = {};
    for (const c of N.COLECOES) {
      const lista = obj.dados[c] == null ? [] : obj.dados[c];
      if (!Array.isArray(lista)) { erros.push(`"${c}" não é uma lista.`); continue; }
      const ids = new Set();
      lista.forEach((x, i) => {
        if (!x || typeof x !== 'object' || Array.isArray(x)) return erros.push(`${c}[${i}] não é um registro.`);
        if (typeof x.id !== 'string' || !N.ID.test(x.id)) return erros.push(`${c}[${i}] tem um identificador inválido.`);
        if (ids.has(x.id)) return erros.push(`${c}: "${x.id}" aparece duas vezes.`);
        ids.add(x.id);
        if (c === 'diario') {
          if (!N.dataValida(x.id) || x.data !== x.id) erros.push(`diario: "${x.id}" não é uma data válida.`);
          if (x.consumo && Object.keys(x.consumo).length > N.LIMITES.consumoPorDia) erros.push(`diario: "${x.id}" tem registros demais.`);
        }
      });
      dados[c] = lista;
      contagem[c] = lista.length;
    }
    return { ok: !erros.length, erros: erros.slice(0, 8), totalErros: erros.length, dados, contagem, exportadoEm: obj.exportadoEm || null };
  };

  else raiz.Nucleo = N;

  const mensagemErro = (e) => MENSAGENS[e && e.code] || (e && e.message) || 'Erro desconhecido.';

  function limpar(o) {

      _avisar() { this.versao++; for (const fn of this._ouvintes) { try { fn(); } catch (e) { console.error(e); } } },
      _avisarConta() { for (const fn of this._ouvintesConta) { try { fn(this.usuario); } catch (e) { console.error(e); } } },
      _vazio() {
        return { perfil: null, metas: [], alimentos: [], receitas: [], plano: [], fichas: [], exercicios_custom: [], medidas: [], habitos: [], ultimas: {}, backups: [], dias: new Map(), sessoes: new Map() };

      /** Lê dias e sessões antigos (fora da janela), para calendário e gráficos. Fica no cache. */
      async carregarPeriodo(de, ate) {

          this._col('diario').where('data', '>=', de).where('data', '<=', ate).get(),
          this._col('sessoes').where('data', '>=', de).where('data', '<=', ate).get(),

      _exigirLogin() { if (!this.raiz) { const e = new Error('Entre na sua conta para gravar.'); e.code = 'unauthenticated'; throw e; } },
      _enfileirar(chave, fn) {

      novoId(prefixo) {

      },

      /** Grava o documento inteiro (configurações, fichas, plano, alimentos, medidas…). */
      async salvarDoc(col, obj) {
        this._exigirLogin();
        N.validar.id(obj.id);
        const ref = this._col(col).doc(obj.id);
        return this._enfileirar(`${col}/${obj.id}`, () => this._confirmar(ref.set(limpar(obj))));
      },
      async excluirDoc(col, id) {
        this._exigirLogin();
        return this._enfileirar(`${col}/${id}`, () => this._confirmar(this._col(col).doc(id).delete()));
      },
      /** Grava só os campos indicados: pares [[['consumo', id], valor], …]. Valor D.APAGAR remove o campo.
          No diário, o campo `data` vai junto (as regras exigem). */
      async gravarCampos(col, id, pares) {
        this._exigirLogin();
        N.validar.id(id);
        if (col === 'diario') N.validar.data(id, 'Dia');
        const FP = this.fb.firestore.FieldPath;
        const corpo = {};
        const campos = [];
        const todos = col === 'diario' ? [[['data'], id], ...pares] : pares;
        for (const [seg, valor] of todos) {
          for (const s of seg) if (typeof s !== 'string' || !s || s.length > 120) throw Object.assign(new Error('Caminho de campo inválido.'), { code: 'invalid-argument' });
          let x = corpo;
          for (let i = 0; i < seg.length - 1; i++) x = x[seg[i]] = x[seg[i]] && typeof x[seg[i]] === 'object' ? x[seg[i]] : {};
          x[seg[seg.length - 1]] = valor === APAGAR ? this.fb.firestore.FieldValue.delete() : valor;
          campos.push(new FP(...seg));
        }
        const ref = this._col(col).doc(id);
        return this._enfileirar(`${col}/${id}`, () => this._confirmar(ref.set(corpo, { mergeFields: campos })));
      },

      // ---------- lotes, backup, importação ----------
      async _emLotes(ops, aoAvancar) {
        for (let i = 0; i < ops.length; i += MAX_LOTE) {
          const b = this.db.batch();
          for (const op of ops.slice(i, i + MAX_LOTE)) op(b);
          await this._confirmar(b.commit());
          if (aoAvancar) aoAvancar(Math.min(ops.length, i + MAX_LOTE), ops.length);
        }
      },
      /** Lê TODOS os documentos de todas as coleções (incluindo dias e sessões fora da janela). */
      async lerTudo() {
        this._exigirLogin();
        const r = {};

          const s = await this._col(c).get();
          r[c] = s.docs.map((d) => ({ ...structuredClone(d.data()), id: d.id }));
        }
        return r;
      },
      listaBackups() { return this.estado.backups.slice().sort((a, b) => (a.criadoEm < b.criadoEm ? 1 : -1)); },
      async criarBackup(motivo, dadosProntos) {
        this._exigirLogin();
        const dados = dadosProntos || await this.lerTudo();
        const txt = JSON.stringify(N.montarBackup(dados, new Date().toISOString()));
        const partes = N.partir(txt, TAM_PARTE);
        const id = this.novoId('bk');
        const ops = partes.map((p, i) => (b) => b.set(this._col('backupPartes').doc(`${id}_${i}`), { conteudo: p }));
        ops.push((b) => b.set(this._col('backups').doc(id), {
          criadoEm: new Date().toISOString(), dia: N.hoje(), motivo: motivo || 'automático', hash: N.hashDados(dados), partes: partes.length,
          contagem: Object.fromEntries(N.COLECOES.map((c) => [c, (dados[c] || []).length])),
        }));
        await this._emLotes(ops);
        const sobra = this.listaBackups().filter((b) => b.id !== id).slice(MAX_BACKUPS - 1);
        for (const b of sobra) await this.excluirBackup(b);
        return id;
      },
      async excluirBackup(b) {
        const ops = [(x) => x.delete(this._col('backups').doc(b.id))];
        for (let i = 0; i < (b.partes || 0); i++) ops.push((x) => x.delete(this._col('backupPartes').doc(`${b.id}_${i}`)));
        await this._emLotes(ops);
      },
      async lerBackup(b) {
        this._exigirLogin();
        let txt = '';
        for (let i = 0; i < b.partes; i++) {
          const s = await this._col('backupPartes').doc(`${b.id}_${i}`).get();
          if (!s.exists) throw Object.assign(new Error('Uma parte deste backup está faltando.'), { code: 'invalid-argument' });
          txt += s.data().conteudo;
        }
        return JSON.parse(txt);
      },
      /** No máximo um backup automático por dia, e só se algo mudou. */
      async backupDiario() {
        const ultimo = this.listaBackups()[0];
        if (ultimo && ultimo.dia === N.hoje()) return false;
        const dados = await this.lerTudo();
        if (N.COLECOES.every((c) => !(dados[c] || []).length)) return false;
        if (ultimo && ultimo.hash === N.hashDados(dados)) return false;
        await this.criarBackup('automático', dados);
        return true;
      },
      /** Troca todos os dados pelos de `novos` (já validados). Faz um backup antes. */
      async substituirTudo(novos, aoAvancar) {
        this._exigirLogin();
        const atual = await this.lerTudo();
        if (N.COLECOES.some((c) => (atual[c] || []).length)) await this.criarBackup('antes de substituir os dados', atual);
        const ops = [];
        for (const c of N.COLECOES) {
          const novosIds = new Set((novos[c] || []).map((x) => x.id));
          for (const x of atual[c] || []) if (!novosIds.has(x.id)) ops.push((b) => b.delete(this._col(c).doc(x.id)));
          for (const x of novos[c] || []) ops.push((b) => b.set(this._col(c).doc(x.id), limpar(x)));
        }
        await this._emLotes(ops, aoAvancar);

  const P = {

  async function gravar(fn) {

    const t = document.createElement('span'); t.textContent = msg; el.appendChild(t);
    if (opts.desfazer) { const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Desfazer'; b.onclick = () => { el.remove(); opts.desfazer(); }; el.appendChild(b); }
    $('#toasts').appendChild(el);
    setTimeout(() => el.remove(), opts.ms || (opts.desfazer ? 6000 : 3000));
    return el;
  }

  // ---------- modais ----------
  const pilha = [];
  let nModal = 0;
  function abrirModal({ titulo, corpo, rodape, largo, aoMontar, fecharNoVeu, aoFechar }) {
    const id = 'mt' + (++nModal);
    const veu = document.createElement('div');
    veu.className = 'veu';
    veu.innerHTML = `<div class="modal${largo ? ' largo' : ''}" role="dialog" aria-modal="true" aria-labelledby="${id}">
      <div class="modal-cab"><h2 id="${id}">${titulo}</h2><button type="button" class="fechar" data-fechar aria-label="Fechar">${ic('x')}</button></div>
      <div class="modal-corpo">${corpo}</div>${rodape ? `<div class="modal-rodape">${rodape}</div>` : ''}</div>`;
    veu._aoFechar = aoFechar;
    veu.addEventListener('click', (ev) => { if (ev.target.closest('[data-fechar]') || (fecharNoVeu && ev.target === veu)) fecharModal(veu); });
    $('#modal-raiz').appendChild(veu);
    pilha.push(veu);
    if (aoMontar) aoMontar(veu);
    const foco = veu.querySelector('[autofocus]');
    if (foco && !matchMedia('(max-width: 620px)').matches) setTimeout(() => foco.focus(), 30);
    return veu;
  }
  function fecharModal(veu) {
    const v = veu || pilha[pilha.length - 1];
    if (!v) return;
    const i = pilha.indexOf(v);
    if (i >= 0) pilha.splice(i, 1);
    v.remove();
    if (v._aoFechar) v._aoFechar();
  }
  function confirmar({ titulo, texto, botao = 'Confirmar', perigo, extra, cancelar = 'Cancelar' }) {
    return new Promise((ok) => {
      let resp = false;
      abrirModal({
        titulo: esc(titulo), fecharNoVeu: true,
        corpo: `<p style="color:var(--ink-2)">${texto}</p>${extra || ''}`,
        rodape: `<div class="dir"><button type="button" class="botao" data-fechar>${esc(cancelar)}</button><button type="button" class="botao ${perigo ? 'perigo cheio' : 'primario'}" data-sim>${esc(botao)}</button></div>`,
        aoMontar: (v) => { v.querySelector('[data-sim]').onclick = () => { resp = true; fecharModal(v); }; },
        aoFechar: () => ok(resp),

  }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && pilha.length) fecharModal(); });
  const opt = (v, t, sel) => `<option value="${esc(v)}"${sel ? ' selected' : ''}>${esc(t)}</option>`;
  const rodapeForm = (esq, salvar = 'Salvar') => `${esq || ''}<div class="dir"><button type="button" class="botao" data-fechar>Cancelar</button><button type="button" class="botao primario" data-salvar>${salvar}</button></div>`;
  function ligarEnvio(v, fn) {
    const b = v.querySelector('[data-salvar]');

        if (typeof r === 'string') { if (er) er.textContent = r; else toast(r, { tipo: 'erro' }); }

    };
    b.onclick = enviar;
    const f = v.querySelector('form'); if (f) f.addEventListener('submit', enviar);

  const val = (v, sel) => { const el = v.querySelector(sel); return el ? el.value.trim() : ''; };
  const diasChips = (nome, sel) => `<div class="dias-semana">${N.DIAS.map((d, i) => `<label class="chip"><input type="checkbox" name="${nome}" value="${i}"${sel.includes(i) ? ' checked' : ''}><span>${d}</span></label>`).join('')}</div>`;
  const lerDias = (v, nome) => $$(`input[name="${nome}"]:checked`, v).map((x) => Number(x.value));

  // ====================================================================
  // RENDERIZAÇÃO
  // ====================================================================
  // Enquanto o dedo/mouse está pressionado, a tela não é redesenhada: assim um toque logo depois de digitar
  // (ex.: carga -> ✓) não se perde porque o botão foi trocado no meio do toque.
  let agendado = false, segurando = false, pendente = false;
  function render() {
    if (segurando) { pendente = true; return; }
    if (agendado) return;
    agendado = true;
    setTimeout(() => { agendado = false; if (segurando) { pendente = true; return; } renderAgora(); }, 0);
  }
  document.addEventListener('pointerdown', () => { segurando = true; }, true);
  const soltar = () => { if (!segurando) return; setTimeout(() => { segurando = false; if (pendente) { pendente = false; render(); } }, 0); };
  document.addEventListener('pointerup', soltar, true);

  function renderNav() {

  function renderAgora() {

    const foco = guardarFoco();

  function guardarFoco() {

  function restaurarFoco(f) {

  // ---------- telas de entrada ----------
  const G_LOGO = '<svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';
  /** Navegadores embutidos em apps (WhatsApp, Instagram, Facebook, etc.), onde o login do Google falha. */

  async function salvarConfig() {

  // ====================================================================
  // HOJE

  function anel(consumido, meta) {
    const r = 62, circ = 2 * Math.PI * r;
    const frac = meta ? Math.min(1, consumido / meta) : 0;
    return `<div class="anel"><svg viewBox="0 0 150 150" aria-hidden="true"><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="14"/>
      ${meta ? `<circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--accent)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${(frac * circ).toFixed(1)} ${circ.toFixed(1)}"/>` : ''}</svg>
      <div class="centro"><b>${N.fmt(consumido)}</b><small>${meta ? `de ${N.fmt(meta)} kcal` : 'kcal'}</small></div></div>`;
  }
  const barraMacro = (rot, v, meta, cor) => `<div class="macro"><div class="info"><span>${rot}</span><span><b>${N.fmt(v)}</b>${meta ? ` / ${N.fmt(meta)} g` : ' g'}</span></div><div class="barra"><i style="width:${meta ? Math.min(100, (v / meta) * 100) : 0}%;background:${cor}"></i></div></div>`;
  function vHoje() {
    const c = C();
    const consumos = N.consumosDoDia(c.dia);
    const tot = N.somar(consumos.map((x) => x.macros));
    const m = c.meta || {};
    const plano = N.planoDoDia(c.e.plano, S.dia);
    let h = '';
    if (c.andamento) {
      const pr = N.progressoSessao(c.andamento);
